<style>
/* Layout: sticky top bar → hero band → content column (max 1080px). Deep navy ground, violet light. */
:root {
  --bg: #0b0e22;
  --bg-2: #11153a;

  --surface-2: #1f2560;
  --line: #2d3373;
  --fg: #eeeaff;
  --muted: #a4a2d4;
  --violet: #8f63ff;
  --violet-soft: #b9a2ff;
  --indigo: #3d4fe0;
  --good: #3ddc97;
  --bad: #ff6b8b;
  --der: #6fa8ff;
  --die: #ff7ac0;
  --das: #4fe0b0;
  --bar-bg: rgba(11, 14, 34, .9);
  --glow-1: rgba(143, 99, 255, .22);
  --glow-2: rgba(61, 79, 224, .22);
  --shadow: rgba(6, 4, 30, .55);
  --tint: rgba(143, 99, 255, .1);
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]):not([data-app-theme]) {
  --bg: #f3f1fb;
  --bg-2: #e9e5f7;
  --surface: #ffffff;
  --surface-2: #f0ebff;
  --line: #dad4ef;
  --fg: #1a1740;
  --muted: #5d5a86;
  --violet: #7446ef;
  --violet-soft: #6236dc;
  --indigo: #3446d6;
  --good: #109e64;
  --bad: #db3a63;
  --der: #2563d9;
  --die: #cf2f86;
  --das: #0b8f69;
  --bar-bg: rgba(255, 255, 255, .9);
  --glow-1: rgba(143, 99, 255, .16);
  --glow-2: rgba(61, 79, 224, .1);
  --shadow: rgba(52, 36, 130, .16);
  --tint: rgba(116, 70, 239, .08);
  color-scheme: light; } }

  --line: #dad4ef;
  --fg: #1a1740;

  --violet: #7446ef;
  --violet-soft: #6236dc;
  --indigo: #3446d6;
  --good: #109e64;
  --bad: #db3a63;
  --der: #2563d9;
  --die: #cf2f86;
  --das: #0b8f69;
  --bar-bg: rgba(255, 255, 255, .9);
  --glow-1: rgba(143, 99, 255, .16);
  --glow-2: rgba(61, 79, 224, .1);
  --shadow: rgba(52, 36, 130, .16);
  --tint: rgba(116, 70, 239, .08);
  color-scheme: light; }
:root[data-app-theme="light"] {
  --bg: #f3f1fb;
  --bg-2: #e9e5f7;
  --surface: #ffffff;
  --surface-2: #f0ebff;
  --line: #dad4ef;
  --fg: #1a1740;
  --muted: #5d5a86;
  --violet: #7446ef;
  --violet-soft: #6236dc;
  --indigo: #3446d6;
  --good: #109e64;
  --bad: #db3a63;
  --der: #2563d9;
  --die: #cf2f86;
  --das: #0b8f69;
  --bar-bg: rgba(255, 255, 255, .9);
  --glow-1: rgba(143, 99, 255, .16);
  --glow-2: rgba(61, 79, 224, .1);
  --shadow: rgba(52, 36, 130, .16);
  --tint: rgba(116, 70, 239, .08);
  color-scheme: light; }
:root[data-app-theme="dark"] {
  --bg: #0b0e22;
  --bg-2: #11153a;
  --surface: #171c48;
  --surface-2: #1f2560;
  --line: #2d3373;
  --fg: #eeeaff;
  --muted: #a4a2d4;
  --violet: #8f63ff;
  --violet-soft: #b9a2ff;
  --indigo: #3d4fe0;
  --good: #3ddc97;
  --bad: #ff6b8b;
  --der: #6fa8ff;
  --die: #ff7ac0;

  --bar-bg: rgba(11, 14, 34, .9);
  --glow-1: rgba(143, 99, 255, .22);
  --glow-2: rgba(61, 79, 224, .22);
  --shadow: rgba(6, 4, 30, .55);
  --tint: rgba(143, 99, 255, .1);

* { box-sizing: border-box; }
html { background: var(--bg); overflow-x: clip; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(900px 500px at 85% -10%, var(--glow-1), transparent 60%),
    radial-gradient(700px 500px at -10% 10%, var(--glow-2), transparent 60%);
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar-bg); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--violet-soft); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar-bg); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--indigo), var(--violet)); display: grid; place-items: center; font-size: 14px; font-weight: 800; color: #fff; box-shadow: 0 6px 20px rgba(143, 99, 255, .4); }
.nav { margin-left: auto; display: flex; gap: 4px; }
.nav a { text-decoration: none; padding: 7px 12px; border-radius: 10px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav a:hover { color: var(--fg); background: var(--surface); }
.nav a.on { color: var(--fg); background: var(--surface-2); }
.nav { min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { white-space: nowrap; }


main { padding-block: 24px calc(120px + env(safe-area-inset-bottom, 0px)); }

/* type */
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.02em; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; }
h2 { font-size: clamp(20px, 3vw, 26px); font-weight: 700; }
h3 { font-size: 17px; font-weight: 700; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--violet-soft); }
.lead { color: var(--muted); max-width: 62ch; font-size: 17px; margin: 0; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

/* hero */
.hero { display: grid; gap: 14px; padding-block: 12px 28px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }

/* level path */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.lvl { position: relative; display: flex; flex-direction: column; gap: 10px; text-decoration: none; padding: 20px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(160deg, var(--surface) 0%, var(--bg-2) 100%); overflow: hidden; transition: transform .15s, border-color .15s; }
.lvl:hover { transform: translateY(-2px); border-color: var(--violet); }
.lvl-code { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; background: linear-gradient(120deg, var(--violet-soft), var(--der)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lvl-name { font-weight: 700; font-size: 17px; }
.lvl p { margin: 0; color: var(--muted); font-size: 14px; }
.lvl .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.bar { height: 6px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--indigo), var(--violet)); border-radius: 6px; }
.pct { font-family: var(--font-mono); font-size: 12px; color: var(--violet-soft); font-variant-numeric: tabular-nums; }

.continue { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 16px 18px; border-radius: var(--r); border: 1px solid var(--violet); background: linear-gradient(90deg, rgba(143, 99, 255, .18), rgba(61, 79, 224, .1)); text-decoration: none; margin-bottom: 28px; }

/* level page */
.back { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.back:hover { color: var(--fg); }
.lvl-head { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
.lvl-head .lvl-code { font-size: 64px; }
.tabs { display: flex; gap: 6px; padding: 5px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 13px; width: fit-content; max-width: 100%; margin-bottom: 22px; flex-wrap: wrap; }
.tabs a, .tabs button { border: 0; background: none; text-decoration: none; padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs .on { background: var(--violet); color: #fff; }
.tabs .count { font-family: var(--font-mono); font-size: 12px; opacity: .8; margin-left: 4px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 8px; text-decoration: none; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); transition: border-color .15s, background .15s; min-width: 0; }
.tile:hover { border-color: var(--violet); background: var(--surface-2); }
.tile .num { font-family: var(--font-mono); font-size: 12px; color: var(--violet-soft); }
.tile h3 { font-family: var(--font-body); font-size: 16px; letter-spacing: 0; }
.tile .sub { color: var(--muted); font-size: 13px; }
.tile.done { border-color: rgba(61, 220, 151, .5); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-block: 18px; }
.seg { display: inline-flex; padding: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 11px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface-2); color: var(--fg); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--violet); }
.btn.primary { background: var(--violet); border-color: var(--violet); color: #fff; }
.btn.primary:hover { background: #7d4ff5; }
.btn.good { background: rgba(61, 220, 151, .15); border-color: var(--good); }
.btn.bad { background: rgba(255, 107, 139, .12); border-color: var(--bad); }

/* word list */
.words { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.w { display: grid; grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr) 38px; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.w:first-child { border-top: 0; }
.w.learned { background: rgba(61, 220, 151, .06); }
.w .de { font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.w .ru { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pl { font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px; }
.art-der { color: var(--der); }
.art-die { color: var(--die); }
.art-das { color: var(--das); }
.ico { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); display: grid; place-items: center; padding: 0; }
.ico:hover { border-color: var(--violet); }
.ico svg { width: 16px; height: 16px; }
.ico.on { background: var(--good); border-color: var(--good); color: #062a1b; }
.lvl-tag { font-family: var(--font-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--violet-soft); margin-right: 6px; vertical-align: 2px; }
@media (max-width: 560px) {
  .w { grid-template-columns: 38px minmax(0, 1fr) 38px; grid-template-areas: "s de c" "s ru c"; row-gap: 0; }
  .w .sp { grid-area: s; } .w .de { grid-area: de; } .w .ru { grid-area: ru; } .w .ck { grid-area: c; }
}

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend b { font-weight: 700; }

/* flashcards */
.card-stage { display: grid; place-items: center; gap: 18px; padding-block: 10px; }
.flash { width: min(520px, 100%); min-height: 250px; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(150deg, var(--surface-2), var(--bg-2)); display: grid; place-items: center; text-align: center; padding: 28px; cursor: pointer; position: relative; box-shadow: 0 20px 60px var(--shadow); }
.flash .big { font-family: var(--font-display); font-size: clamp(24px, 5vw, 36px); font-weight: 700; overflow-wrap: anywhere; }
.flash .hint { position: absolute; bottom: 14px; left: 0; right: 0; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.flash .ans { margin-top: 12px; font-size: 20px; color: var(--violet-soft); }
.counter { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }

/* quiz */
.quiz { width: min(620px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.q-word { font-family: var(--font-display); font-size: clamp(22px, 4.5vw, 32px); font-weight: 700; text-align: center; padding: 26px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); overflow-wrap: anywhere; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; border-radius: 12px; font-weight: 600; overflow-wrap: anywhere; }
.opt:hover:not([disabled]) { border-color: var(--violet); }
.opt.right { border-color: var(--good); background: rgba(61, 220, 151, .14); }
.opt.wrong { border-color: var(--bad); background: rgba(255, 107, 139, .14); }
.opt[disabled] { cursor: default; }
.result { text-align: center; padding: 30px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; justify-items: center; }
.result b { font-family: var(--font-display); font-size: 48px; }

/* grammar */
.rule { max-width: 760px; }
.rule p, .rule li { color: var(--fg); }
.rule h3 { margin-top: 22px; margin-bottom: 8px; color: var(--violet-soft); }
.rule ul { padding-left: 20px; }
.rule .note { border-left: 3px solid var(--violet); background: var(--tint); padding: 10px 14px; border-radius: 0 10px 10px 0; margin-block: 14px; }
.rule em { color: var(--violet-soft); font-style: normal; font-weight: 700; }
.tbl-wrap { overflow-x: auto; margin-block: 14px; border: 1px solid var(--line); border-radius: 12px; }
.rule table { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 360px; }
.rule th, .rule td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; }
.rule th { background: var(--surface-2); font-size: 13px; color: var(--muted); font-weight: 700; }
.rule tr:last-child td { border-bottom: 0; }
.rule td:first-child { color: var(--muted); }
.ex { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-block: 10px; }
.ex div { padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface); }
.ex div:first-child { border-top: 0; }
.ex .d { font-weight: 700; }
.ex .r { color: var(--muted); font-size: 14px; }
.gq { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.gq .qt { font-weight: 700; }
.gq .opts { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.gq .why { font-size: 14px; color: var(--muted); }
.gtile .num { font-family: var(--font-mono); }

/* search */
.search-in { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 17px; }
.search-in:focus { outline: none; border-color: var(--violet); }
.empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }

/* части речи и роды */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--fg); }
.chip:hover { border-color: var(--violet); }
.chip.on { background: var(--violet); border-color: var(--violet); color: #fff; }
.chip .count, .pos-head .count, .gcol-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--violet-soft); }
.chip.on .count { color: #fff; }
.pos-stack { display: flex; flex-direction: column; gap: 24px; }
.pos-group { scroll-margin-top: 80px; }
.pos-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.pos-head h3 { font-size: 16px; }
.gcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.gcol { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; min-width: 0; }
.gcol-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.gcol-head .count { margin-left: auto; }
.gart { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.g-der { --gc: var(--der); } .g-die { --gc: var(--die); } .g-das { --gc: var(--das); } .g-pl { --gc: var(--violet-soft); }
.gcol { border-top: 3px solid var(--gc); }
.gart { color: var(--gc); }
.gw { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.gw:first-child { border-top: 0; }
.gde { font-weight: 700; overflow-wrap: anywhere; }
.gru { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.ico.sm { width: 30px; height: 30px; flex: none; }
.art-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.art-btn { font-family: var(--font-display); font-size: 22px; font-weight: 700; padding: 16px 8px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); }
.ab-der { color: var(--der); } .ab-die { color: var(--die); } .ab-das { color: var(--das); }
.art-btn:hover:not([disabled]) { border-color: currentColor; }
.art-btn.right { border-color: var(--good); background: rgba(61, 220, 151, .14); }
.art-btn.wrong { border-color: var(--bad); background: rgba(255, 107, 139, .14); }
.art-btn[disabled] { cursor: default; }
.why { color: var(--muted); }

/* список тем грамматики */
.glvl { font-family: var(--font-display); font-weight: 800; font-size: 22px; background: linear-gradient(120deg, var(--violet-soft), var(--der)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.trows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.trow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); text-decoration: none; }
.trow:first-child { border-top: 0; }
.trow:hover { background: var(--surface-2); }
.tnum { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--bg-2); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 13px; color: var(--violet-soft); }
.trow.done .tnum { background: var(--good); border-color: var(--good); color: #062a1b; }
.tmain { display: flex; flex-direction: column; min-width: 0; }
.tmain b { font-weight: 700; overflow-wrap: anywhere; }
.tmain span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.tstat { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.trow.done .tstat { color: var(--good); }

/* тексты */
