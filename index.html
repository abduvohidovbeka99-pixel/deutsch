{ t: "Fahrrad statt Auto", x: `Immer mehr Menschen in deutschen Städten lassen das Auto stehen und fahren mit dem Fahrrad. Das hat mehrere Gründe. In der Stadt ist man mit dem Rad auf kurzen Strecken oft schneller als mit dem Auto, denn man steht nicht im Stau und muss keinen Parkplatz suchen. Außerdem ist Radfahren gesund und billig. Und natürlich ist es gut für die Umwelt, weil es keine Abgase produziert. Viele Städte bauen deshalb neue Radwege. Besonders beliebt sind E-Bikes, mit denen man auch längere Strecken oder Hügel ohne große Anstrengung schafft. Trotzdem gibt es Kritik: Viele Radfahrer fühlen sich auf den Straßen nicht sicher, weil die Radwege zu schmal sind oder plötzlich enden. Kopenhagen und Amsterdam gelten als Vorbilder: Dort gibt es breite, getrennte Radwege, und fast die Hälfte der Menschen fährt täglich mit dem Rad zur Arbeit.`,
g: `die Strecke=расстояние, маршрут
die Abgase=выхлопные газы
die Anstrengung=усилие
schmal=узкий
das Vorbild=пример для подражания`,
q: [["c", "Warum ist man in der Stadt mit dem Rad oft schneller?", ["Fahrräder sind schneller als Autos.", "Man steht nicht im Stau und sucht keinen Parkplatz.", "Es gibt keine Ampeln."], 1], ["t", "Viele Radfahrer fühlen sich auf den Straßen sicher.", 0], ["c", "Was ist das Problem mit manchen Radwegen?", ["Sie sind zu schmal oder enden plötzlich.", "Sie sind zu teuer.", "Sie sind zu breit."], 0], ["t", "In Kopenhagen fährt fast die Hälfte der Menschen mit dem Rad zur Arbeit.", 1], ["i", "Welche Fahrräder sind besonders beliebt?", ["E-Bikes", "E-Bike", "Elektrofahrräder"]]] },

{ t: "Großeltern erzählen", x: `„Als ich so alt war wie du, gab es bei uns noch kein Telefon“, erzählt Opa Heinrich seiner Enkelin Mia. Mia ist vierzehn und kann sich das kaum vorstellen. Heinrich ist 1950 in einem Dorf in Niedersachsen geboren. Seine Eltern hatten einen Bauernhof, und die Kinder mussten früh mithelfen: Kühe melken, Heu machen, Kartoffeln ernten. Zur Schule ging er zu Fuß, vier Kilometer hin und zurück, auch im Winter. Urlaub kannte die Familie nicht. Das erste Mal am Meer war Heinrich mit zwanzig. „Aber wir waren zufrieden“, sagt er. „Wir hatten wenig, aber wir hatten Zeit füreinander.“ Mia erzählt ihm dafür von ihrem Alltag: von Online-Unterricht, Videoanrufen mit Freunden in Kanada und ihrem Traum, in Australien zu studieren. Heinrich staunt. Beide sind sich einig: Jede Generation hat ihre eigenen Herausforderungen.`,

{ t: "Jugendliche und soziale Netzwerke", x: `Für die meisten Jugendlichen gehören soziale Netzwerke selbstverständlich zum Alltag. Laut aktuellen Studien verbringen 12- bis 19-Jährige in Deutschland durchschnittlich mehr als drei Stunden täglich online. Sie chatten mit Freunden, schauen kurze Videos und teilen Fotos. Das hat durchaus positive Seiten: Jugendliche bleiben mit Freunden in Kontakt, finden Informationen und können kreativ sein. Doch Psychologen warnen auch vor Risiken. Wer ständig perfekte Bilder von anderen sieht, ist mit dem eigenen Leben und Aussehen oft unzufrieden. Außerdem ist Cybermobbing ein ernstes Problem: Fast jeder fünfte Schüler wurde schon einmal online beleidigt oder bloßgestellt. Viele Schulen bieten deshalb Kurse zur Medienkompetenz an. Dort lernen die Jugendlichen, wie sie ihre Daten schützen, Falschmeldungen erkennen und respektvoll miteinander umgehen.`,

{ t: "Eine Reise mit Hindernissen", x: `Eigentlich sollte es ein entspannter Kurzurlaub in Lissabon werden. Doch schon am Flughafen fing das Chaos an: Wegen eines Streiks wurde unser Flug um sechs Stunden verschoben. Wir saßen auf unbequemen Stühlen und aßen überteuerte Sandwiches. Als wir endlich mitten in der Nacht in Lissabon landeten, war mein Koffer nicht da. Am Schalter für Gepäckermittlung musste ich ein langes Formular ausfüllen. Man versprach mir, den Koffer am nächsten Tag ins Hotel zu bringen. Ohne Zahnbürste und frische Kleidung kauften wir am Morgen das Nötigste ein. Der Koffer kam erst am dritten Tag. Trotzdem wurde die Reise noch schön: Die Sonne schien, die Stadt war wunderbar, und in einem kleinen Restaurant hörten wir abends Fado-Musik. Heute lachen wir über die Geschichte – und ich packe immer Ersatzkleidung ins Handgepäck.`,

überteuert=слишком дорогой
das Nötigste=самое необходимое
das Handgepäck=ручная кладь`,

{ t: "Gesund essen im Alltag", x: `Viele Menschen möchten sich gesünder ernähren, scheitern aber am Alltag. Nach einem langen Arbeitstag fehlt oft die Energie zum Kochen, und schnell landet eine Tiefkühlpizza im Ofen. Ernährungsexperten geben deshalb praktische Tipps. Erstens: Planen Sie Ihre Mahlzeiten für die Woche und kaufen Sie gezielt ein. Wer eine Einkaufsliste hat, greift seltener zu Süßigkeiten. Zweitens: Kochen Sie am Wochenende größere Mengen vor und frieren Sie Portionen ein. Drittens: Essen Sie möglichst viel Gemüse – die Hälfte des Tellers sollte aus Gemüse oder Salat bestehen. Viertens: Trinken Sie genug Wasser, mindestens anderthalb Liter am Tag, und vermeiden Sie zuckerhaltige Getränke. Wichtig ist auch, sich nichts komplett zu verbieten. Wer sich ab und zu ein Stück Kuchen gönnt, hält eine gesunde Ernährung langfristig besser durch als jemand mit strengen Verboten.`,
g: `scheitern=терпеть неудачу
gezielt=целенаправленно
einfrieren=замораживать
sich gönnen=позволить себе
durchhalten=выдерживать`,
q: [["c", "Warum essen viele Menschen nach der Arbeit ungesund?", ["Es fehlt die Energie zum Kochen.", "Gesundes Essen ist zu teuer.", "Sie mögen kein Gemüse."], 0], ["c", "Wie viel des Tellers sollte aus Gemüse bestehen?", ["ein Viertel", "die Hälfte", "alles"], 1], ["t", "Man sollte sich Süßes komplett verbieten.", 0], ["t", "Eine Einkaufsliste hilft, seltener Süßigkeiten zu kaufen.", 1], ["i", "Wie viele Liter Wasser sollte man mindestens trinken? (Zahl oder Wort)", ["anderthalb", "1,5", "eineinhalb", "anderthalb Liter"]]] },

{ t: "Das deutsche Schulsystem", x: `In Deutschland beginnt die Schule meistens mit sechs Jahren. Alle Kinder besuchen zuerst die Grundschule, die in den meisten Bundesländern vier Jahre dauert. Danach müssen sich die Familien – mit einer Empfehlung der Lehrer – für eine weiterführende Schule entscheiden. Das Gymnasium dauert acht oder neun Jahre und endet mit dem Abitur, das zum Studium an einer Universität berechtigt. Die Realschule endet nach der zehnten Klasse mit der Mittleren Reife. Danach machen viele Jugendliche eine Ausbildung. In vielen Bundesländern gibt es außerdem Gesamtschulen, in denen Schüler mit unterschiedlichen Leistungen gemeinsam lernen. Kritiker sagen, dass die Entscheidung nach der vierten Klasse zu früh kommt, denn mit zehn Jahren ist noch nicht klar, welche Talente ein Kind hat. Da Bildung Ländersache ist, unterscheiden sich die Regeln von Bundesland zu Bundesland.`,

berechtigen=давать право

{ t: "Streit unter Freunden", x: `Lukas und Tim sind seit der Grundschule beste Freunde. Letzten Monat wollten sie zusammen auf ein Konzert ihrer Lieblingsband gehen. Lukas hatte die Tickets gekauft, und Tim sollte ihm das Geld zurückgeben. Doch zwei Tage vor dem Konzert sagte Tim plötzlich ab: Er wollte lieber mit seiner neuen Freundin ein Wochenende in Prag verbringen. Lukas war wütend. Nicht wegen des Geldes, sondern weil er sich zurückgesetzt fühlte. Er schrieb Tim eine böse Nachricht, und Tim antwortete genauso unfreundlich. Drei Wochen sprachen sie kein Wort miteinander. Schließlich rief Tim an und entschuldigte sich. Er gab zu, dass er sich egoistisch verhalten hatte. Auch Lukas sagte, dass seine Nachricht zu hart gewesen sei. Sie trafen sich in ihrem Lieblingscafé und redeten lange. Am Ende waren sie sich einig: Eine Freundschaft muss so etwas aushalten können.`,
g: `absagen=отменять
sich zurückgesetzt fühlen=чувствовать себя обделённым
zugeben=признавать
sich verhalten=вести себя
aushalten=выдерживать`,
q: [["c", "Seit wann sind Lukas und Tim Freunde?", ["seit dem Studium", "seit der Grundschule", "seit einem Jahr"], 1], ["c", "Warum war Lukas wütend?", ["wegen des Geldes", "weil er sich zurückgesetzt fühlte", "weil das Konzert ausfiel"], 1], ["t", "Lukas hat sich zuerst entschuldigt.", 0], ["t", "Beide haben zugegeben, Fehler gemacht zu haben.", 1], ["i", "In welche Stadt wollte Tim mit seiner Freundin fahren?", ["Prag", "nach Prag"]]] },

{ t: "Pünktlichkeit – typisch deutsch?", x: `Pünktlichkeit gilt als typisch deutsche Tugend. Und tatsächlich: Wer in Deutschland zu einem beruflichen Termin eingeladen ist, sollte auf keinen Fall zu spät kommen. Schon fünf Minuten Verspätung gelten als unhöflich, wenn man nicht vorher Bescheid sagt. Viele Deutsche kommen deshalb lieber ein paar Minuten zu früh. Im privaten Bereich ist es etwas lockerer. Bei einer Party ist es durchaus normal, eine Viertelstunde später zu kommen. Bei einem Essen bei Freunden sollte man aber pünktlich sein, damit das Essen nicht kalt wird. Ironischerweise ist ausgerechnet die Deutsche Bahn bekannt dafür, oft nicht pünktlich zu sein. Viele Pendler ärgern sich täglich über Verspätungen und Zugausfälle. Ausländische Besucher finden das manchmal lustig: Das Land der Pünktlichkeit hat Probleme mit seinen Zügen.`,

Bescheid sagen=предупредить
locker=непринуждённо
ausgerechnet=как раз, именно
der Pendler=человек, ездящий на работу из пригорода`,
q: [["c", "Wie gelten fünf Minuten Verspätung bei einem beruflichen Termin?", ["als normal", "als unhöflich", "als witzig"], 1], ["t", "Bei einer Party ist es normal, etwas später zu kommen.", 1], ["c", "Warum sollte man bei einem Essen bei Freunden pünktlich sein?", ["damit das Essen nicht kalt wird", "weil es Geschenke gibt", "weil die Gastgeber früh schlafen"], 0], ["t", "Die Deutsche Bahn ist für ihre Pünktlichkeit bekannt.", 0], ["i", "Wie nennt man Menschen, die täglich zur Arbeit fahren und sich über Züge ärgern?", ["Pendler", "die Pendler"]]] },

{ t: "Auf dem Flohmarkt", x: `Jeden ersten Sonntag im Monat findet auf dem großen Platz in unserer Stadt ein Flohmarkt statt. Schon um sieben Uhr morgens bauen die Verkäufer ihre Stände auf. Man findet dort fast alles: alte Bücher, Schallplatten, Kleidung, Spielzeug, Geschirr und manchmal sogar richtige Antiquitäten. Ich gehe gern hin, auch wenn ich nichts Bestimmtes suche. Das Schönste ist das Handeln. Niemand bezahlt den ersten Preis, den der Verkäufer nennt. Letzten Monat habe ich eine alte Kamera entdeckt. Der Verkäufer wollte 40 Euro. Ich habe 20 geboten, und am Ende haben wir uns auf 28 Euro geeinigt. Zu Hause habe ich festgestellt, dass die Kamera noch funktioniert! Flohmärkte sind außerdem nachhaltig: Statt Dinge wegzuwerfen, bekommen sie ein zweites Leben.`,
g: `stattfinden=проходить, состояться
die Schallplatte=виниловая пластинка
handeln=торговаться
bieten=предлагать (цену)
feststellen=установить, обнаружить`,

{ t: "Zu wenig Schlaf", x: `Fast jeder dritte Erwachsene in Deutschland schläft regelmäßig schlecht. Experten empfehlen sieben bis neun Stunden Schlaf pro Nacht, doch viele Menschen kommen nur auf fünf oder sechs. Die Folgen sind ernster, als man denkt. Wer dauerhaft zu wenig schläft, kann sich schlechter konzentrieren, ist gereizt und macht mehr Fehler. Auf Dauer steigt sogar das Risiko für Übergewicht, Herzkrankheiten und Depressionen. Zu den häufigsten Ursachen gehören Stress, unregelmäßige Arbeitszeiten und das Smartphone im Bett. Das blaue Licht der Bildschirme signalisiert dem Gehirn, dass es noch Tag ist. Schlafforscher raten deshalb, eine Stunde vor dem Schlafengehen keine Bildschirme mehr zu nutzen. Hilfreich sind auch feste Schlafenszeiten, ein kühles, dunkles Schlafzimmer und der Verzicht auf Kaffee am Nachmittag.`,
g: `dauerhaft=постоянно
gereizt=раздражённый
das Übergewicht=лишний вес
die Ursache=причина
der Verzicht auf=отказ от`,
q: [["c", "Wie viele Stunden Schlaf empfehlen Experten?", ["fünf bis sechs", "sieben bis neun", "zehn"], 1], ["t", "Zu wenig Schlaf kann das Risiko für Herzkrankheiten erhöhen.", 1], ["c", "Was signalisiert das blaue Licht dem Gehirn?", ["dass es Zeit zum Schlafen ist", "dass es noch Tag ist", "dass man Hunger hat"], 1], ["t", "Schlafforscher empfehlen ein warmes, helles Schlafzimmer.", 0], ["i", "Worauf sollte man am Nachmittag verzichten?", ["Kaffee", "auf Kaffee"]]] },

{ t: "Ein Jahr als Au-pair", x: `Nach dem Abitur wusste Sofia aus Brasilien noch nicht genau, was sie studieren wollte. Deshalb entschied sie sich, ein Jahr als Au-pair in Deutschland zu verbringen. Sie lebte bei einer Familie in Freiburg mit zwei Kindern, vier und sieben Jahre alt. Zu ihren Aufgaben gehörte es, die Kinder vom Kindergarten und von der Schule abzuholen, mit ihnen zu spielen und manchmal einfache Mahlzeiten zu kochen. Dafür bekam sie ein eigenes Zimmer, Essen und ein Taschengeld. Vormittags besuchte sie einen Sprachkurs. Am Anfang war das Heimweh groß, und die Sprache war eine echte Herausforderung. Doch mit der Zeit fühlte sie sich wie ein Teil der Familie. Die Kinder brachten ihr viele Wörter bei, die sie im Kurs nie gelernt hätte. Nach dem Jahr wusste Sofia, was sie wollte: Sie studiert jetzt Pädagogik in Heidelberg.`,
g: `das Au-pair=au pair (няня по обмену)
das Taschengeld=карманные деньги
das Heimweh=тоска по дому
beibringen=обучать`,

{ t: "Das Pfandsystem", x: `Wer in Deutschland eine Flasche Wasser oder eine Dose Cola kauft, bezahlt oft mehr als den angegebenen Preis: das sogenannte Pfand. Für Einwegflaschen aus Plastik und Dosen sind es 25 Cent, für viele Mehrwegflaschen aus Glas 8 bis 15 Cent. Bringt man die leere Flasche zurück in den Supermarkt, bekommt man das Geld wieder. Dafür gibt es Automaten, die die Flaschen annehmen und einen Bon drucken, den man an der Kasse einlöst. Das System wurde 2003 eingeführt, um die Umwelt zu schützen. Und es funktioniert: Über 95 Prozent der Pfandflaschen kommen zurück. Man sieht deshalb kaum Flaschen in Parks oder auf der Straße. Manche Menschen mit wenig Geld sammeln Pfandflaschen, um sich etwas dazuzuverdienen. Viele Leute stellen ihre leeren Flaschen deshalb bewusst neben den Mülleimer, statt sie wegzuwerfen.`,

die Mehrwegflasche=многоразовая бутылка
einlösen=обналичить (чек)

q: [["c", "Wie hoch ist das Pfand für Einwegflaschen aus Plastik?", ["8 Cent", "15 Cent", "25 Cent"], 2], ["c", "Was macht der Automat?", ["Er gibt sofort Bargeld.", "Er druckt einen Bon.", "Er wäscht die Flaschen."], 1], ["t", "Weniger als die Hälfte der Pfandflaschen kommt zurück.", 0], ["t", "Manche Menschen sammeln Pfandflaschen, um Geld zu verdienen.", 1], ["i", "In welchem Jahr wurde das System eingeführt?", ["2003"]]] },

{ t: "Das Konzert", x: `Ich war sechzehn, als ich zum ersten Mal allein auf ein großes Konzert durfte. Meine Eltern waren nicht begeistert, aber nach langen Diskussionen erlaubten sie es, unter einer Bedingung: Ich musste um Mitternacht zu Hause sein. Das Konzert fand in einer riesigen Halle statt, und als die Band auf die Bühne kam, schrien zwanzigtausend Menschen gleichzeitig. Ich stand ganz vorne und sang jedes Lied mit. Es war der glücklichste Abend meines Lebens. Doch nach dem Konzert war die letzte Straßenbahn schon weg. Mein Handy-Akku war leer, und ich hatte kein Geld für ein Taxi. Ich lief eine Stunde zu Fuß durch die dunkle Stadt. Als ich um halb eins vor der Tür stand, wartete mein Vater schon. Er war nicht wütend, nur erleichtert. Er machte mir eine heiße Schokolade und sagte: „Erzähl mal, wie war's?“`,
g: `begeistert=в восторге
die Bedingung=условие
riesig=огромный
erleichtert=почувствовавший облегчение`,
q: [["c", "Wie alt war die Person?", ["vierzehn", "sechzehn", "achtzehn"], 1], ["c", "Was war die Bedingung der Eltern?", ["Sie musste mit einer Freundin gehen.", "Sie musste um Mitternacht zu Hause sein.", "Sie musste das Ticket selbst bezahlen."], 1], ["t", "Die Person ist mit dem Taxi nach Hause gefahren.", 0], ["t", "Der Vater war wütend.", 0], ["i", "Was hat der Vater gemacht? Eine heiße …", ["Schokolade", "heiße Schokolade"]]] },

{ t: "Online einkaufen", x: `Ob Kleidung, Elektronik oder Lebensmittel – immer mehr Deutsche kaufen im Internet ein. Die Vorteile liegen auf der Hand: Man kann rund um die Uhr bestellen, Preise schnell vergleichen und muss das Haus nicht verlassen. Besonders praktisch ist das Rückgaberecht: Innerhalb von 14 Tagen kann man Waren ohne Angabe von Gründen zurückschicken. Genau das wird aber zum Problem. Viele Kunden bestellen Kleidung in drei Größen und schicken zwei davon zurück. Die Rücksendungen verursachen viel Verkehr, CO2 und Kosten. Ein Teil der zurückgeschickten Waren wird sogar vernichtet, weil die Kontrolle teurer wäre als das Produkt. Auch der lokale Einzelhandel leidet: In vielen Innenstädten stehen Geschäfte leer. Einige Städte versuchen gegenzusteuern, indem sie lokale Online-Plattformen aufbauen, auf denen man bei Geschäften aus der Nachbarschaft bestellen kann.`,

vernichten=уничтожать
der Einzelhandel=розничная торговля`,
q: [["c", "Innerhalb wie vieler Tage kann man Waren zurückschicken?", ["7", "14", "30"], 1], ["t", "Man muss einen Grund für die Rücksendung angeben.", 0], ["c", "Warum werden manche zurückgeschickten Waren vernichtet?", ["weil sie kaputt sind", "weil die Kontrolle teurer wäre als das Produkt", "weil es ein Gesetz verlangt"], 1], ["t", "In vielen Innenstädten stehen Geschäfte leer.", 1], ["i", "Was bauen manche Städte auf, um lokale Geschäfte zu unterstützen? Lokale Online-…", ["Plattformen", "Online-Plattformen"]]] },

{ t: "Der alte Bäcker", x: `In der kleinen Straße, in der ich aufgewachsen bin, gab es eine Bäckerei. Der Bäcker, Herr Krause, stand jeden Morgen um drei Uhr auf, um Brot und Brötchen zu backen. Als Kinder bekamen wir von ihm immer ein Stück Streuselkuchen geschenkt, wenn wir für unsere Mütter Brot holten. Herr Krause kannte jeden im Viertel beim Namen. Er wusste, wer krank war, wer ein Baby bekommen hatte und wer Sorgen hatte. Vor einigen Jahren hörte ich, dass die Bäckerei schließen musste. Ein großer Supermarkt mit eigener Backstation hatte nur zweihundert Meter entfernt eröffnet, und die jungen Leute kauften lieber dort. Herr Krause war damals 71 Jahre alt und fand keinen Nachfolger. Am letzten Tag kamen Hunderte Menschen aus dem ganzen Viertel, um sich zu verabschieden. Sie standen bis auf die Straße. Herr Krause weinte. Ich auch.`,
g: `aufwachsen=вырастать
der Streuselkuchen=пирог с посыпкой
das Viertel=квартал, район
der Nachfolger=преемник
sich verabschieden=прощаться`,

{ t: "Die Vier-Tage-Woche", x: `Kaum ein arbeitspolitisches Thema wird derzeit so leidenschaftlich diskutiert wie die Vier-Tage-Woche. Die Idee: Beschäftigte arbeiten nur noch an vier Tagen, bei gleichem Gehalt. Befürworter verweisen auf Pilotprojekte, etwa in Großbritannien, wo zahlreiche Unternehmen das Modell ein halbes Jahr lang testeten. Das Ergebnis überraschte viele: Die Produktivität blieb weitgehend stabil, während Krankmeldungen und Kündigungen deutlich zurückgingen. Die Mitarbeitenden berichteten von weniger Stress und mehr Zeit für Familie und Erholung. Kritiker halten dagegen, dass sich das Modell nicht auf alle Branchen übertragen lässt. In der Pflege, im Einzelhandel oder in der Produktion kann man die Arbeit nicht einfach verdichten – hier würde eine Verkürzung zusätzliches Personal erfordern, das angesichts des Fachkräftemangels kaum zu finden ist. Zudem warnen Arbeitgeberverbände vor steigenden Kosten und sinkender Wettbewerbsfähigkeit. Einig sind sich die meisten Experten nur in einem Punkt: Die Arbeitswelt verändert sich, und starre Modelle haben ausgedient.`,

verdichten=уплотнять

{ t: "Künstliche Intelligenz im Alltag", x: `Künstliche Intelligenz ist längst kein Zukunftsthema mehr. Sie steckt in Navigations-Apps, die Staus vorhersagen, in Streamingdiensten, die Filme empfehlen, und in Sprachassistenten, die auf Zuruf das Licht einschalten. Seit textgenerierende Systeme öffentlich zugänglich sind, nutzen Millionen Menschen KI auch zum Schreiben von E-Mails, zum Übersetzen oder zum Lernen. Die Chancen sind enorm: In der Medizin erkennen Algorithmen Tumore auf Röntgenbildern teilweise früher als Fachärzte, und in der Verwaltung könnten Routineaufgaben automatisiert werden. Gleichzeitig wachsen die Bedenken. Wer haftet, wenn eine KI eine falsche Entscheidung trifft? Wie lässt sich verhindern, dass Systeme Vorurteile aus ihren Trainingsdaten übernehmen und etwa bei Bewerbungen bestimmte Gruppen benachteiligen? Die Europäische Union hat deshalb Regeln beschlossen, die KI-Anwendungen nach ihrem Risiko einstufen. Besonders riskante Systeme müssen strenge Auflagen erfüllen. Ob die Gesetzgebung mit dem rasanten Tempo der Entwicklung Schritt halten kann, bleibt allerdings abzuwarten.`,
g: `auf Zuruf=по голосовой команде
zugänglich=доступный
die Bedenken=опасения
einstufen=классифицировать
Schritt halten mit=идти в ногу с`,
q: [["c", "Wofür werden Algorithmen in der Medizin laut Text eingesetzt?", ["für Operationen", "zum Erkennen von Tumoren auf Röntgenbildern", "für die Terminplanung"], 1], ["t", "KI-Systeme können Vorurteile aus Trainingsdaten übernehmen.", 1], ["c", "Wie stuft die EU KI-Anwendungen ein?", ["nach ihrem Preis", "nach ihrem Risiko", "nach ihrem Herkunftsland"], 1], ["t", "Es ist sicher, dass die Gesetze mit der Entwicklung Schritt halten.", 0], ["i", "Welche Organisation hat Regeln für KI beschlossen? (Abkürzung oder Name)", ["EU", "die EU", "Europäische Union", "die Europäische Union"]]] },

{ t: "Der Fachkräftemangel", x: `In Deutschland fehlen Hunderttausende Fachkräfte – in Pflegeheimen, Kitas, Handwerksbetrieben und IT-Abteilungen. Ein Hauptgrund ist der demografische Wandel: Die geburtenstarken Jahrgänge der 1960er Jahre gehen nach und nach in Rente, während deutlich weniger junge Menschen nachrücken. Hinzu kommt, dass sich viele Schulabgänger für ein Studium statt für eine Ausbildung entscheiden, obwohl gerade im Handwerk die Berufsaussichten ausgezeichnet sind. Die Folgen spüren alle: Wer einen Termin beim Elektriker braucht, wartet oft wochenlang, und manche Kitas müssen ihre Öffnungszeiten verkürzen. Politik und Wirtschaft setzen auf mehrere Strategien. Ein neues Einwanderungsgesetz soll es Fachkräften aus Nicht-EU-Ländern erleichtern, nach Deutschland zu kommen. Zugleich sollen mehr Frauen und ältere Menschen für den Arbeitsmarkt gewonnen werden, etwa durch bessere Kinderbetreuung und flexible Übergänge in den Ruhestand. Kritiker bemängeln jedoch, dass Visaverfahren noch immer zu bürokratisch sind und ausländische Abschlüsse zu langsam anerkannt werden.`,
g: `geburtenstark=многочисленный (о поколении)
nachrücken=приходить на смену
die Berufsaussichten=профессиональные перспективы
der Ruhestand=пенсия (состояние)
bemängeln=критиковать, указывать на недостатки`,
q: [["c", "Was ist laut Text ein Hauptgrund für den Fachkräftemangel?", ["der demografische Wandel", "zu hohe Löhne", "die Digitalisierung"], 0], ["t", "Die Berufsaussichten im Handwerk sind schlecht.", 0], ["c", "Welche Maßnahme wird genannt?", ["ein neues Einwanderungsgesetz", "die Abschaffung der Rente", "höhere Steuern"], 0], ["t", "Kritiker finden die Visaverfahren zu bürokratisch.", 1], ["i", "Aus welchem Jahrzehnt stammen die geburtenstarken Jahrgänge? (z. B. 1960er)", ["1960er", "1960er Jahre", "60er", "den 1960er Jahren"]]] },

{ t: "Stadt oder Land?", x: `Jahrzehntelang kannte die Bevölkerungsentwicklung nur eine Richtung: vom Land in die Stadt. Junge Menschen zogen wegen Ausbildung, Arbeit und Kultur in die Metropolen, während Dörfer überalterten und Geschäfte schlossen. Doch seit einigen Jahren beobachten Forscher eine Gegenbewegung. Immer mehr Familien kehren den Großstädten den Rücken. Die Gründe liegen auf der Hand: Die Mieten in Berlin, München oder Hamburg sind für Normalverdiener kaum noch bezahlbar, während man auf dem Land für dasselbe Geld ein Haus mit Garten bekommt. Durch das Homeoffice ist es zudem nicht mehr nötig, täglich ins Büro zu pendeln. Allerdings ist das Landleben nicht für jeden ein Idyll. Wer ohne Auto lebt, ist in vielen Regionen aufgeschmissen, denn Busse fahren oft nur zweimal am Tag. Ärzte, Schulen und schnelles Internet fehlen in manchen Gegenden ebenfalls. Bürgermeister kleiner Gemeinden werben deshalb aktiv um Zuzügler – mit günstigem Bauland, Coworking-Räumen und dem Versprechen von Gemeinschaft.`,

den Rücken kehren=отворачиваться
bezahlbar=доступный по цене
aufgeschmissen sein=быть беспомощным
der Zuzügler=переселенец`,
q: [["c", "In welche Richtung ging die Bevölkerungsentwicklung jahrzehntelang?", ["von der Stadt aufs Land", "vom Land in die Stadt", "ins Ausland"], 1], ["c", "Welcher Grund für den Umzug aufs Land wird genannt?", ["bessere Schulen", "hohe Mieten in der Stadt", "mehr Kultur"], 1], ["t", "Auf dem Land fahren die Busse in vielen Regionen sehr oft.", 0], ["t", "Bürgermeister werben mit günstigem Bauland um neue Einwohner.", 1], ["i", "Was macht es laut Text unnötig, täglich ins Büro zu pendeln?", ["Homeoffice", "das Homeoffice"]]] },

{ t: "Fast Fashion", x: `Ein T-Shirt für fünf Euro, eine Jeans für zwanzig – Mode war noch nie so billig wie heute. Große Ketten bringen inzwischen nicht mehr zwei, sondern bis zu zwanzig Kollektionen pro Jahr in die Läden. Dieses Geschäftsmodell, bekannt als Fast Fashion, hat einen hohen Preis, den die Kundinnen und Kunden an der Kasse nicht bezahlen. Für die Produktion einer einzigen Jeans werden mehrere Tausend Liter Wasser benötigt, vor allem für den Anbau der Baumwolle. Beim Färben gelangen giftige Chemikalien in Flüsse. Die Näherinnen in Ländern wie Bangladesch arbeiten oft unter gefährlichen Bedingungen für Löhne, die kaum zum Leben reichen. Gleichzeitig wird ein großer Teil der Kleidung nur wenige Male getragen und landet dann im Müll. Als Alternative gewinnen Secondhand-Läden, Kleidertauschpartys und faire Marken an Beliebtheit. Experten betonen jedoch, dass die nachhaltigste Kleidung diejenige ist, die bereits im Schrank hängt.`,
g: `der Anbau=выращивание
färben=красить
die Näherin=швея

{ t: "Falschmeldungen erkennen", x: `Ein Foto von einem Hai auf einer überfluteten Autobahn, ein angebliches Zitat eines Politikers, eine dramatische Warnung vor einem neuen Virus – solche Meldungen verbreiten sich in sozialen Netzwerken oft rasend schnell. Viele davon sind schlicht erfunden. Falschmeldungen, auch Fake News genannt, zielen meist darauf ab, Emotionen wie Angst oder Wut auszulösen, denn emotionale Inhalte werden häufiger geteilt. Medienpädagogen empfehlen einige einfache Schritte, um sich zu schützen. Zunächst sollte man prüfen, wer hinter einer Nachricht steckt: Gibt es ein Impressum, ist die Quelle bekannt und seriös? Zweitens lohnt sich ein Blick darauf, ob andere etablierte Medien ebenfalls berichten. Bilder kann man mit einer umgekehrten Bildersuche überprüfen – oft stellt sich heraus, dass ein Foto Jahre alt ist oder aus einem völlig anderen Zusammenhang stammt. Und schließlich hilft eine schlichte Regel: Wer bei einer Meldung sofort wütend wird, sollte innehalten, bevor er sie weiterleitet.`,
g: `angeblich=якобы
abzielen auf=быть направленным на
das Impressum=выходные данные сайта
umgekehrt=обратный
innehalten=остановиться`,
q: [["c", "Welche Emotionen sollen Falschmeldungen meist auslösen?", ["Freude und Hoffnung", "Angst oder Wut", "Langeweile"], 1], ["t", "Emotionale Inhalte werden seltener geteilt.", 0], ["c", "Womit kann man Bilder überprüfen?", ["mit einer umgekehrten Bildersuche", "mit einem Wörterbuch", "mit einem Anruf beim Politiker"], 0], ["t", "Man sollte innehalten, wenn man bei einer Meldung sofort wütend wird.", 1], ["i", "Was sollte eine seriöse Webseite haben, damit man sieht, wer dahintersteckt?", ["Impressum", "ein Impressum"]]] },

{ t: "Mehrsprachig aufwachsen", x: `Lange Zeit glaubten Eltern und sogar manche Ärzte, dass Kinder durch zwei Sprachen überfordert würden. Man riet Familien mit Migrationshintergrund, zu Hause lieber Deutsch zu sprechen, auch wenn die Eltern es selbst nur gebrochen beherrschten. Heute weiß die Forschung es besser. Kinder sind in der Lage, mehrere Sprachen gleichzeitig zu lernen, ohne dass dies ihrer Entwicklung schadet. Zwar mischen mehrsprachige Kinder anfangs manchmal Wörter aus beiden Sprachen, doch das ist eine normale Phase und kein Zeichen von Verwirrung. Studien deuten sogar darauf hin, dass Mehrsprachigkeit bestimmte kognitive Fähigkeiten fördert, etwa die Fähigkeit, die Aufmerksamkeit zu steuern oder zwischen Aufgaben zu wechseln. Entscheidend ist, dass die Kinder beide Sprachen ausreichend und in guter Qualität hören. Sprachwissenschaftler empfehlen den Eltern deshalb, mit ihren Kindern in der Sprache zu sprechen, die sie selbst am besten beherrschen – denn eine reiche, emotionale Sprache sei wichtiger als eine fehlerhafte Zweitsprache.`,
g: `überfordert=перегруженный
gebrochen=ломано (о языке)
die Verwirrung=путаница
hindeuten auf=указывать на
beherrschen=владеть (языком)`,
q: [["c", "Was riet man Familien früher?", ["zu Hause Deutsch zu sprechen", "zwei Sprachen zu lernen", "keine Sprache zu fördern"], 0], ["t", "Das Mischen von Wörtern ist ein Zeichen von Verwirrung.", 0], ["c", "Welche Fähigkeit fördert Mehrsprachigkeit laut Studien?", ["das Rechnen", "das Steuern der Aufmerksamkeit", "das Singen"], 1], ["t", "Eltern sollten die Sprache sprechen, die sie am besten beherrschen.", 1], ["i", "Was ist laut Text wichtiger als eine fehlerhafte Zweitsprache? Eine reiche, emotionale …", ["Sprache", "Muttersprache"]]] },

{ t: "Das bedingungslose Grundeinkommen", x: `Stellen Sie sich vor, Sie bekämen jeden Monat 1.200 Euro vom Staat – ohne Bedingungen, ganz gleich, ob Sie arbeiten oder nicht. Diese Idee eines bedingungslosen Grundeinkommens begeistert die einen und empört die anderen. Befürworter argumentieren, dass es Armut wirksam bekämpfen und die Bürokratie des Sozialstaats drastisch vereinfachen würde. Zudem würde es Menschen die Freiheit geben, Tätigkeiten nachzugehen, die gesellschaftlich wertvoll, aber schlecht bezahlt sind, etwa die Pflege von Angehörigen oder ehrenamtliche Arbeit. Angesichts der Automatisierung, die viele Jobs überflüssig machen könnte, sei ein Grundeinkommen zudem eine Antwort auf die Zukunft der Arbeit. Gegner halten dagegen, dass es kaum finanzierbar sei und die Anreize zur Erwerbsarbeit schwäche. In einem Berliner Modellprojekt erhielten 122 Menschen drei Jahre lang monatlich 1.200 Euro. Die ersten Ergebnisse zeigten, dass kaum jemand seinen Job kündigte – viele nutzten das Geld stattdessen für Weiterbildung oder fühlten sich psychisch deutlich entlastet.`,
g: `bedingungslos=безусловный
empören=возмущать
nachgehen=заниматься (деятельностью)
der Anreiz=стимул
entlastet=разгруженный`,
q: [["c", "Wie viel Geld erhielten die Teilnehmer im Berliner Projekt monatlich?", ["800 Euro", "1.000 Euro", "1.200 Euro"], 2], ["t", "Befürworter glauben, dass das Grundeinkommen die Bürokratie vereinfachen würde.", 1], ["c", "Was befürchten Gegner?", ["dass es die Anreize zur Arbeit schwächt", "dass es zu wenig Geld ist", "dass es die Automatisierung stoppt"], 0], ["t", "Im Modellprojekt kündigten viele Teilnehmer ihren Job.", 0], ["i", "Wie viele Jahre lief das Berliner Modellprojekt? (Zahl)", ["3", "drei", "drei Jahre"]]] },

{ t: "Wenn Touristen zur Last werden", x: `Venedig, Barcelona, Dubrovnik oder Hallstatt in Österreich – diese Orte haben ein gemeinsames Problem: Sie sind zu beliebt. Der Begriff „Overtourism“ beschreibt Situationen, in denen so viele Touristen kommen, dass die Lebensqualität der Einwohner und die Umwelt darunter leiden. In der Altstadt von Venedig leben inzwischen weniger als 50.000 Menschen, während täglich ein Vielfaches an Tagesgästen durch die Gassen strömt. Wohnungen werden zu Ferienunterkünften umgewandelt, wodurch die Mieten für Einheimische steigen. Bäckereien und Handwerker verschwinden, Souvenirläden nehmen ihren Platz ein. Viele Städte reagieren inzwischen mit Gegenmaßnahmen. Venedig verlangt an bestimmten Tagen eine Eintrittsgebühr für Tagestouristen und hat große Kreuzfahrtschiffe aus der Lagune verbannt. Barcelona begrenzt die Zahl der Ferienwohnungen. Tourismusforscher plädieren zudem dafür, Besucherströme besser zu verteilen: auf weniger bekannte Orte und auf die Nebensaison.`,
g: `das Vielfache=многократное количество
die Gasse=переулок
umwandeln=превращать
verbannen=изгонять
plädieren für=выступать за`,
q: [["c", "Was beschreibt der Begriff „Overtourism“?", ["zu wenige Touristen", "zu viele Touristen, sodass Einwohner und Umwelt leiden", "Luxustourismus"], 1], ["c", "Was hat Venedig eingeführt?", ["ein Fahrverbot", "eine Eintrittsgebühr für Tagestouristen", "eine Hotelsteuer für Einwohner"], 1], ["t", "In der Altstadt von Venedig leben mehr als 100.000 Menschen.", 0], ["t", "Barcelona begrenzt die Zahl der Ferienwohnungen.", 1], ["i", "Wann sollten Touristen laut Forschern öfter reisen? In der …", ["Nebensaison"]]] },

{ t: "Gärten auf dem Dach", x: `Wer in Berlin, Hamburg oder Leipzig mit offenen Augen durch die Stadt geht, entdeckt sie immer häufiger: Gemüsebeete auf Dächern, Tomatenpflanzen auf Balkonen und gemeinschaftliche Gärten auf ehemaligen Parkplätzen. Urban Gardening, das Gärtnern in der Stadt, hat sich von einer Nischenbewegung zu einem Trend entwickelt. Für viele Teilnehmende geht es dabei um weit mehr als frisches Gemüse. Gemeinschaftsgärten sind Orte der Begegnung, an denen Menschen unterschiedlicher Herkunft und Generationen zusammenkommen. Kinder lernen, woher Lebensmittel kommen, und Rentner geben ihr Wissen weiter. Auch ökologisch bringt das Stadtgrün Vorteile. Pflanzen kühlen die Umgebung an heißen Tagen, binden Staub und bieten Bienen und anderen Insekten Nahrung. Begrünte Dächer speichern außerdem Regenwasser und entlasten so die Kanalisation bei Starkregen. Kritiker wenden ein, dass die Erträge zu gering seien, um die Ernährung einer Stadt wirklich zu verändern. Doch darum, so die Gärtnerinnen und Gärtner, gehe es auch gar nicht.`,
g: `das Beet=грядка
die Begegnung=встреча
binden=связывать, задерживать
der Starkregen=ливень
der Ertrag=урожай`,
q: [["c", "Was ist Urban Gardening?", ["Gärtnern in der Stadt", "ein Gartenmarkt", "eine Gartenzeitschrift"], 0], ["t", "Gemeinschaftsgärten sind auch Orte der Begegnung.", 1], ["c", "Welcher ökologische Vorteil wird genannt?", ["Pflanzen kühlen die Umgebung.", "Pflanzen produzieren Strom.", "Pflanzen ersetzen Autos."], 0], ["t", "Kritiker meinen, die Erträge könnten die Ernährung einer Stadt verändern.", 0], ["i", "Was speichern begrünte Dächer?", ["Regenwasser", "Wasser"]]] },

{ t: "Der Brief im Schrank", x: `Als meine Großmutter starb, mussten wir ihre Wohnung ausräumen. Es war eine traurige Arbeit: Jedes Möbelstück, jede Tasse erinnerte an Nachmittage mit ihr. Ganz hinten in ihrem Kleiderschrank fand ich eine Blechdose. Darin lagen Dutzende Briefe, mit einem roten Band zusammengebunden. Sie waren alle an meine Großmutter adressiert, aber nicht von meinem Großvater. Der Absender war ein gewisser Jean aus Lyon. Die Briefe stammten aus den Jahren 1956 und 1957. Ich zögerte lange, bevor ich den ersten öffnete. Jean schrieb auf Deutsch, mit vielen Fehlern, aber voller Zärtlichkeit. Er erzählte von seiner Arbeit in einer Druckerei und fragte immer wieder, wann sie ihn besuchen komme. Der letzte Brief war kurz: Er habe verstanden, dass sie sich für ein Leben in Deutschland entschieden habe, und wünsche ihr alles Glück der Welt. Meine Großmutter hatte nie von ihm erzählt. Sie hatte die Briefe aber über sechzig Jahre lang aufbewahrt.`,
g: `ausräumen=освобождать (от вещей)
die Blechdose=жестяная коробка
zögern=колебаться
die Zärtlichkeit=нежность
aufbewahren=хранить`,
q: [["c", "Wo fand der Erzähler die Briefe?", ["im Keller", "hinten im Kleiderschrank", "unter dem Bett"], 1], ["c", "Woher stammte der Absender?", ["aus Paris", "aus Lyon", "aus Marseille"], 1], ["t", "Die Briefe waren vom Großvater.", 0], ["t", "Die Großmutter hatte nie von Jean erzählt.", 1], ["i", "Wo arbeitete Jean?", ["Druckerei", "in einer Druckerei"]]] },

{ t: "Digital Detox", x: `Durchschnittlich greifen Menschen in Deutschland mehr als 80-mal am Tag zu ihrem Smartphone. Oft geschieht das ganz automatisch: an der Bushaltestelle, beim Warten auf den Kaffee, sogar während eines Gesprächs. Psychologen sprechen von einer Gewohnheit, die zunehmend zwanghafte Züge annehmen kann. Benachrichtigungen, Likes und endlose Feeds sind gezielt so gestaltet, dass sie das Belohnungssystem im Gehirn ansprechen und die Aufmerksamkeit fesseln. Als Gegenbewegung hat sich das sogenannte Digital Detox etabliert – eine bewusste Auszeit von digitalen Geräten. Manche Hotels bieten handyfreie Wochenenden an, bei denen Gäste ihr Smartphone beim Check-in abgeben. Doch Experten halten radikale Verzichtsphasen nur bedingt für sinnvoll. Wirksamer seien kleine, dauerhafte Veränderungen: Benachrichtigungen ausschalten, das Handy nicht mit ins Schlafzimmer nehmen und feste handyfreie Zeiten, etwa beim Essen, einführen. Es gehe nicht darum, Technik zu verteufeln, sondern sie wieder bewusst zu nutzen.`,
g: `zwanghaft=навязчивый
die Benachrichtigung=уведомление
fesseln=приковывать
bedingt=ограниченно
verteufeln=демонизировать`,
q: [["c", "Wie oft greifen Menschen in Deutschland durchschnittlich täglich zum Smartphone?", ["etwa 20-mal", "mehr als 80-mal", "über 300-mal"], 1], ["t", "Feeds und Benachrichtigungen sind zufällig gestaltet.", 0], ["c", "Was halten Experten für wirksamer als radikale Verzichtsphasen?", ["kleine, dauerhafte Veränderungen", "ein neues Handy", "gar keine Veränderung"], 0], ["t", "Laut Text soll man Technik komplett ablehnen.", 0], ["i", "Welches System im Gehirn sprechen Likes und Benachrichtigungen an? Das …", ["Belohnungssystem"]]] },

{ t: "Elektroautos", x: `Elektroautos gelten als Schlüssel für einen klimafreundlicheren Verkehr. Sie stoßen während der Fahrt keine Abgase aus und sind deutlich leiser als Verbrenner. Doch die Bilanz ist komplizierter, als es auf den ersten Blick scheint. Die Herstellung der Batterie verbraucht viel Energie und Rohstoffe wie Lithium und Kobalt, deren Abbau oft mit Umweltschäden und schlechten Arbeitsbedingungen verbunden ist. Ein E-Auto startet deshalb mit einem ökologischen „Rucksack“. Studien zeigen jedoch, dass es diesen Nachteil nach einigen Zehntausend Kilometern ausgleicht – vorausgesetzt, es wird mit Strom aus erneuerbaren Quellen geladen. Für viele Verbraucher sind andere Fragen entscheidender: Wie weit komme ich mit einer Ladung? Wo kann ich laden? Was kostet das Auto? Gerade auf dem Land und in Mietshäusern ohne eigene Ladestation ist die Infrastruktur noch lückenhaft. Hinzu kommt, dass neue Elektroautos in der Anschaffung meist teurer sind als vergleichbare Benziner. Verkehrsexperten betonen zudem, dass E-Autos allein das Verkehrsproblem nicht lösen. Auch ein elektrisches Auto braucht Platz und steht im Stau.`,
g: `der Verbrenner=автомобиль с ДВС
der Abbau=добыча
ausgleichen=компенсировать
lückenhaft=неполный, с пробелами
die Anschaffung=приобретение`,

{ t: "Lebenslanges Lernen", x: `Früher lernte man einen Beruf und übte ihn bis zur Rente aus. Dieses Modell gehört weitgehend der Vergangenheit an. Technologische Veränderungen, insbesondere die Digitalisierung, führen dazu, dass sich Berufsbilder in hohem Tempo wandeln. Was man vor zehn Jahren in der Ausbildung gelernt hat, ist heute vielleicht schon überholt. Das Schlagwort lautet daher „lebenslanges Lernen“. Gemeint ist die Bereitschaft, sich während des gesamten Lebens weiterzubilden – beruflich wie privat. Die Möglichkeiten sind so vielfältig wie nie: Volkshochschulen, berufsbegleitende Studiengänge, Online-Kurse und Lern-Apps. Viele Arbeitgeber unterstützen Weiterbildungen finanziell, weil sie qualifizierte Mitarbeitende halten wollen. Dennoch zeigen Statistiken ein Ungleichgewicht: Wer bereits gut ausgebildet ist, bildet sich häufiger weiter als Geringqualifizierte – also gerade jene, deren Arbeitsplätze am stärksten von der Automatisierung bedroht sind. Bildungsforscher fordern deshalb gezielte Angebote und mehr Beratung für diese Gruppe.`,

berufsbegleitend=без отрыва от работы
das Ungleichgewicht=дисбаланс
bedroht=находящийся под угрозой`,
q: [["c", "Was ist laut Text ein Hauptgrund für den schnellen Wandel der Berufsbilder?", ["die Digitalisierung", "die Globalisierung des Sports", "das Wetter"], 0], ["t", "Viele Arbeitgeber unterstützen Weiterbildungen finanziell.", 1], ["c", "Wer bildet sich laut Statistik häufiger weiter?", ["Geringqualifizierte", "bereits gut Ausgebildete", "Rentner"], 1], ["t", "Geringqualifizierte sind am wenigsten von der Automatisierung bedroht.", 0], ["i", "Wie lautet das Schlagwort des Textes? (zwei Wörter)", ["lebenslanges Lernen", "Lebenslanges Lernen"]]] },

{ t: "Wohnungsnot in Großstädten", x: `„Besichtigung um 18 Uhr“ – wer in einer deutschen Großstadt eine Wohnung sucht, kennt die Situation: Vor dem Haus stehen fünfzig Menschen in einer Schlange, alle mit Mappen voller Gehaltsnachweise und Schufa-Auskünften. Die Wohnungsnot hat längst nicht mehr nur Geringverdiener erreicht, sondern auch die Mittelschicht. In vielen Städten müssen Mieterinnen und Mieter mehr als ein Drittel ihres Einkommens für die Miete ausgeben. Die Ursachen sind vielfältig. Die Städte wachsen, gleichzeitig wurde jahrelang zu wenig gebaut, vor allem im Bereich der Sozialwohnungen. Steigende Baukosten und hohe Zinsen bremsen den Neubau zusätzlich. Die Politik hat verschiedene Instrumente eingeführt, etwa die Mietpreisbremse, die Mieterhöhungen bei Neuvermietungen begrenzen soll. Ihre Wirkung ist allerdings umstritten, da es zahlreiche Ausnahmen gibt. Manche Städte setzen auf kommunalen Wohnungsbau, andere auf Genossenschaften, in denen die Bewohner gemeinsam Eigentümer sind.`,

die Mittelschicht=средний класс
bremsen=тормозить

{ t: "Sport für die Seele", x: `Dass Bewegung gut für den Körper ist, weiß jeder. Weniger bekannt ist, wie stark sie sich auf die Psyche auswirkt. Zahlreiche Studien belegen, dass regelmäßiger Sport Stress reduziert, die Stimmung verbessert und sogar bei leichten bis mittelschweren Depressionen ähnlich wirksam sein kann wie Medikamente. Beim Ausdauertraining schüttet der Körper Botenstoffe wie Endorphine und Serotonin aus, die das Wohlbefinden steigern. Zudem schläft besser, wer sich tagsüber körperlich verausgabt. Wichtig ist dabei weniger die Intensität als die Regelmäßigkeit. Schon dreimal pro Woche dreißig Minuten zügiges Gehen können einen messbaren Unterschied machen. Mannschaftssportarten haben einen zusätzlichen Vorteil: Sie schaffen soziale Kontakte und ein Gefühl der Zugehörigkeit. Psychotherapeuten integrieren Bewegung deshalb zunehmend in ihre Behandlungen. Allerdings warnen sie auch vor dem Gegenteil: Wer Sport zwanghaft betreibt und sich über Leistung definiert, riskiert Erschöpfung und Verletzungen.`,
g: `die Stimmung=настроение

sich verausgaben=выкладываться
zügig=быстрым шагом
die Zugehörigkeit=принадлежность`,

{ t: "Die Nachtschicht", x: `Um 22 Uhr, wenn die Stadt langsam zur Ruhe kommt, beginnt für Mehmet die Arbeit. Er fährt seit elf Jahren Taxi, immer nachts. Seine Fahrgäste sind so unterschiedlich wie die Stadt selbst: Krankenschwestern, die von der Spätschicht kommen, Geschäftsleute mit verpasstem Anschlussflug, junge Leute auf dem Weg von einer Party zur nächsten. Viele reden mehr als tagsüber. „Nachts sind die Menschen ehrlicher“, sagt Mehmet. „Vielleicht, weil sie müde sind. Oder weil sie wissen, dass sie mich nie wiedersehen.“ Er hat Heiratsanträge mitangehört, Liebeskummer getröstet und einmal eine Frau ins Krankenhaus gefahren, die kurz darauf ihr Kind bekam. Die Arbeit ist nicht leicht. Der Schlafrhythmus ist dauerhaft gestört, und seine Familie sieht er fast nur am Wochenende. Seit es Fahrdienste per App gibt, ist auch der Verdienst gesunken. Trotzdem möchte er nicht tauschen. „Die Nacht“, sagt er, „zeigt dir eine Stadt, die die meisten nie kennenlernen.“`,
g: `zur Ruhe kommen=успокаиваться
der Heiratsantrag=предложение руки и сердца
trösten=утешать
gestört=нарушенный
tauschen=меняться`,
q: [["c", "Seit wie vielen Jahren fährt Mehmet Taxi?", ["seit fünf", "seit elf", "seit zwanzig"], 1], ["c", "Warum sind die Menschen nachts laut Mehmet ehrlicher?", ["Sie haben getrunken.", "Sie sind müde oder sehen ihn nie wieder.", "Sie haben keine Angst."], 1], ["t", "Mehmet sieht seine Familie jeden Abend.", 0], ["t", "Durch Fahrdienste per App ist sein Verdienst gesunken.", 1], ["i", "Um wie viel Uhr beginnt Mehmets Arbeit? (Zahl)", ["22", "zweiundzwanzig", "um 22 Uhr"]]] },

{ t: "Lebensmittelverschwendung", x: `In Deutschland landen jedes Jahr rund elf Millionen Tonnen Lebensmittel im Müll. Mehr als die Hälfte davon stammt aus privaten Haushalten – pro Kopf sind das etwa 80 Kilogramm jährlich. Besonders häufig weggeworfen werden Obst, Gemüse, Brot und Milchprodukte. Ein wesentlicher Grund ist ein Missverständnis: Viele Verbraucher verwechseln das Mindesthaltbarkeitsdatum mit einem Verfallsdatum. Dabei garantiert es lediglich, dass ein Produkt bis zu diesem Datum seine Eigenschaften wie Geschmack und Konsistenz behält. Joghurt, Nudeln oder Käse sind oft noch Tage oder Wochen danach genießbar. Hinzu kommen spontane Großeinkäufe und falsche Lagerung. Gegen die Verschwendung engagieren sich inzwischen zahlreiche Initiativen. Beim Foodsharing holen Freiwillige überschüssige Lebensmittel bei Bäckereien und Supermärkten ab und verteilen sie kostenlos. Apps vermitteln Restaurantportionen kurz vor Ladenschluss zu reduzierten Preisen. Frankreich ist einen Schritt weiter: Dort sind große Supermärkte gesetzlich verpflichtet, unverkaufte Lebensmittel zu spenden.`,
g: `pro Kopf=на душу населения
das Mindesthaltbarkeitsdatum=срок «годен до» (минимальный)
verwechseln=путать

{ t: "Generation Z im Job", x: `Sie gelten als anspruchsvoll, wechselwillig und wenig belastbar – zumindest, wenn man manchen Personalchefs glaubt. Die Rede ist von der Generation Z, also den zwischen etwa 1995 und 2010 Geborenen, die derzeit in den Arbeitsmarkt drängen. Tatsächlich zeigen Umfragen, dass viele junge Beschäftigte andere Prioritäten setzen als ihre Eltern. Ein sicherer Arbeitsplatz und ein gutes Gehalt sind ihnen zwar wichtig, doch ebenso entscheidend sind Sinnhaftigkeit, flexible Arbeitszeiten und eine gesunde Work-Life-Balance. Überstunden als Zeichen von Engagement lehnen viele ab. Soziologen warnen allerdings vor Pauschalurteilen. Erstens unterscheiden sich junge Menschen untereinander stark, je nach Bildung, Herkunft und Branche. Zweitens wurde jeder jungen Generation vorgeworfen, faul und verwöhnt zu sein. Und drittens hat sich die Verhandlungsposition schlicht verändert: Angesichts des Fachkräftemangels können junge Menschen Forderungen stellen, die frühere Generationen sich nicht leisten konnten. Unternehmen, die darauf eingehen, profitieren oft von motivierten und loyalen Mitarbeitenden.`,

{ t: "Der letzte Laden im Dorf", x: `Als vor drei Jahren der letzte Supermarkt in Wellersdorf schloss, schien das Schicksal des 600-Einwohner-Dorfes besiegelt. Die Bäckerei war schon lange weg, die Sparkasse hatte ihre Filiale durch einen Automaten ersetzt, und der Bus fuhr nur noch zweimal täglich in die Kreisstadt. Für ältere Menschen ohne Auto wurde selbst der Kauf von Milch zur Herausforderung. Doch die Wellersdorfer wollten sich damit nicht abfinden. Auf einer Bürgerversammlung entstand die Idee eines Dorfladens, der den Bewohnern selbst gehört. Über 200 Haushalte kauften Anteile zu je 100 Euro. In einer ehemaligen Scheune wurde der Laden eingerichtet. Heute gibt es dort nicht nur Lebensmittel, viele davon von Bauern aus der Umgebung, sondern auch eine Postannahme und eine kleine Kaffee-Ecke. Zwei Teilzeitkräfte sind angestellt, ein Dutzend Ehrenamtliche helfen mit. Reich wird niemand damit. Aber der Laden ist zum Treffpunkt geworden – und das Dorf ist wieder lebendig.`,

{ t: "Die Ökonomie der Aufmerksamkeit", x: `In einer Welt, in der Informationen im Überfluss vorhanden sind, wird ein anderes Gut knapp: unsere Aufmerksamkeit. Bereits in den 1970er Jahren stellte der Ökonom Herbert Simon fest, dass ein Reichtum an Informationen zwangsläufig eine Armut an Aufmerksamkeit erzeuge. Was damals visionär klang, ist heute die Geschäftsgrundlage milliardenschwerer Konzerne. Soziale Netzwerke, Nachrichtenportale und Streamingdienste konkurrieren nicht in erster Linie um unser Geld, sondern um unsere Zeit – denn je länger wir auf einer Plattform verweilen, desto mehr Werbung lässt sich verkaufen. Die Mechanismen, die dabei zum Einsatz kommen, sind ausgefeilt: unendliches Scrollen, automatisch startende Videos, personalisierte Empfehlungen und Benachrichtigungen, die gezielt auf psychologische Schwachstellen abzielen. Kritiker sprechen von einer „Ökonomie der Ablenkung“, die nicht nur die Konzentrationsfähigkeit des Einzelnen untergrabe, sondern auch den öffentlichen Diskurs verändere: Zugespitzte, empörende Inhalte erzeugen schlicht mehr Interaktion als differenzierte Analysen. Ob Regulierung, Medienbildung oder ein bewussterer Umgang mit Technik die Antwort ist, bleibt umstritten. Einig ist man sich darin, dass Aufmerksamkeit eine Ressource ist, die es zu schützen gilt.`,

verweilen=задерживаться
ausgefeilt=отточенный
die Ablenkung=отвлечение
zugespitzt=заострённый`,

{ t: "Misstrauen gegenüber der Wissenschaft", x: `Noch nie wusste die Menschheit so viel wie heute, und doch scheint das Vertrauen in wissenschaftliche Erkenntnisse in Teilen der Bevölkerung zu bröckeln. Ob beim Klimawandel, bei Impfungen oder bei der Evolution – überall begegnet man Menschen, die gesicherte Befunde anzweifeln. Die Gründe dafür sind vielschichtig. Zum einen ist Wissenschaft ein Prozess, der von Irrtümern und Korrekturen lebt. Was für Forschende selbstverständlich ist, wirkt auf Laien mitunter wie Unzuverlässigkeit: Wenn Empfehlungen sich ändern, entsteht leicht der Eindruck, „die Wissenschaftler wüssten selbst nicht Bescheid“. Zum anderen werden wissenschaftliche Fragen zunehmend politisch aufgeladen. Wer einer bestimmten Partei oder Weltanschauung nahesteht, übernimmt häufig auch deren Haltung zu Forschungsergebnissen. Hinzu kommt, dass Fachwissen in einer stark spezialisierten Welt für die meisten Menschen schwer nachvollziehbar ist, sodass Vertrauen an die Stelle eigener Überprüfung treten muss. Wissenschaftskommunikatoren plädieren daher für mehr Transparenz: Statt nur Ergebnisse zu verkünden, sollten Forschende offenlegen, wie sie zu ihren Schlüssen gelangen, und auch Unsicherheiten offen benennen.`,

der Laie=непрофессионал
aufgeladen=заряженный (эмоционально, политически)
nahestehen=быть близким
verkünden=объявлять`,

{ t: "Eine alternde Gesellschaft", x: `Deutschland altert. Bereits heute ist mehr als jeder fünfte Einwohner älter als 65 Jahre, und dieser Anteil wird in den kommenden Jahrzehnten weiter steigen. Ursachen sind die seit Langem niedrige Geburtenrate und die erfreulicherweise steigende Lebenserwartung. Die Folgen dieses demografischen Wandels betreffen nahezu alle Lebensbereiche. Am offensichtlichsten ist der Druck auf die Rentenversicherung: Da sie im Umlageverfahren finanziert wird, zahlen die Erwerbstätigen von heute die Renten der heutigen Ruheständler. Kommen auf immer weniger Beitragszahler immer mehr Rentner, geraten entweder die Beiträge, das Rentenniveau oder das Renteneintrittsalter unter Druck. Auch das Gesundheits- und Pflegesystem steht vor enormen Herausforderungen, zumal schon jetzt Pflegekräfte fehlen. Gleichwohl warnen Demografen davor, das Altern ausschließlich als Belastung zu begreifen. Ältere Menschen sind heute im Durchschnitt gesünder, gebildeter und aktiver als frühere Generationen. Viele engagieren sich ehrenamtlich, betreuen Enkelkinder oder würden gern länger arbeiten, wenn die Bedingungen stimmten. Eine kluge Politik, so ihr Fazit, sollte diese Potenziale stärker nutzen, statt sie zu übersehen.`,

{ t: "Freiheit oder Sicherheit?", x: `Nach Terroranschlägen oder spektakulären Verbrechen werden regelmäßig Forderungen laut, den Sicherheitsbehörden mehr Befugnisse einzuräumen: mehr Videoüberwachung im öffentlichen Raum, die Speicherung von Kommunikationsdaten, den Einsatz automatischer Gesichtserkennung. Befürworter argumentieren, wer nichts zu verbergen habe, habe auch nichts zu befürchten. Datenschützer halten diesen Satz für gefährlich irreführend. Privatsphäre sei kein Privileg für Menschen mit Geheimnissen, sondern eine Voraussetzung für eine freie Gesellschaft. Wer damit rechnen müsse, beobachtet zu werden, verhalte sich anders – er äußere sich vorsichtiger, meide bestimmte Orte oder Kontakte. Dieser sogenannte Abschreckungseffekt könne die Meinungsfreiheit untergraben, ohne dass auch nur ein einziges Verbot ausgesprochen werde. Hinzu komme, dass einmal gesammelte Daten Begehrlichkeiten weckten und missbraucht werden könnten, sei es durch Hacker oder durch künftige Regierungen mit weniger demokratischen Absichten. Das Bundesverfassungsgericht hat in mehreren Urteilen Grenzen gezogen und betont, dass Eingriffe in Grundrechte verhältnismäßig sein müssen. Die Abwägung zwischen Freiheit und Sicherheit bleibt damit eine Daueraufgabe des Rechtsstaats.`,

der Abschreckungseffekt=сдерживающий эффект
die Begehrlichkeit=алчность, вожделение

{ t: "Die Genschere", x: `Als die Biochemikerinnen Emmanuelle Charpentier und Jennifer Doudna 2020 den Nobelpreis für Chemie erhielten, würdigte das Komitee eine Methode, die die Biologie revolutioniert hat: die Genschere CRISPR/Cas9. Mit ihr lässt sich das Erbgut von Pflanzen, Tieren und Menschen so präzise, schnell und kostengünstig verändern wie nie zuvor. Die Möglichkeiten scheinen grenzenlos. Erbkrankheiten wie die Sichelzellenanämie könnten geheilt, Nutzpflanzen widerstandsfähiger gegen Dürre gemacht werden. Erste Therapien sind bereits zugelassen. Doch die Technik wirft grundlegende ethische Fragen auf. Besonders umstritten sind Eingriffe in die menschliche Keimbahn, also Veränderungen, die an künftige Generationen vererbt werden. Als ein chinesischer Forscher 2018 die Geburt genetisch veränderter Zwillinge verkündete, löste er weltweit Empörung aus und wurde später zu einer Haftstrafe verurteilt. Kritiker befürchten, dass die Grenze zwischen Heilung und „Optimierung“ verschwimmen könnte – bis hin zu Designerbabys, deren Eigenschaften nach Wunsch ausgewählt werden. Befürworter halten dem entgegen, dass es unethisch wäre, auf eine Technik zu verzichten, die unermessliches Leid verhindern könnte.`,

das Erbgut=генетический материал
widerstandsfähig=устойчивый
die Keimbahn=зародышевая линия
verschwimmen=размываться`,

{ t: "Prägt die Sprache das Denken?", x: `Denken Menschen, die verschiedene Sprachen sprechen, unterschiedlich? Diese Frage beschäftigt Philosophen und Linguisten seit Jahrhunderten. In ihrer radikalen Form, wie sie Mitte des 20. Jahrhunderts mit der Sapir-Whorf-Hypothese verbunden wurde, gilt die These heute als widerlegt: Sprache bestimmt nicht, was wir überhaupt denken können. Wer kein Wort für eine Farbe hat, kann sie dennoch wahrnehmen. In einer abgeschwächten Form erlebt die Idee jedoch eine Renaissance. Experimente deuten darauf hin, dass Sprache unsere Aufmerksamkeit lenkt und beeinflusst, was wir uns merken. Sprecher der australischen Sprache Guugu Yimithirr etwa verwenden statt „links“ und „rechts“ ausschließlich Himmelsrichtungen. Entsprechend verfügen sie über einen bemerkenswerten Orientierungssinn. Ein anderes Beispiel betrifft das grammatische Geschlecht: Einigen Studien zufolge beschreiben Deutschsprachige eine Brücke – im Deutschen feminin – eher mit Adjektiven wie „elegant“, Spanischsprachige hingegen, bei denen das Wort maskulin ist, eher als „stark“. Allerdings ließen sich manche dieser Befunde in Folgestudien nicht replizieren, was zur Vorsicht mahnt. Die Debatte ist also keineswegs abgeschlossen.`,

abgeschwächt=ослабленный
die Himmelsrichtung=сторона света
der Orientierungssinn=чувство ориентации
mahnen=призывать`,

{ t: "Der Mythos der Leistungsgesellschaft", x: `„Jeder kann es schaffen, wenn er sich nur genug anstrengt“ – dieses Versprechen gehört zum Selbstverständnis moderner Gesellschaften. Die Idee der Meritokratie, nach der Positionen und Einkommen allein nach Leistung verteilt werden sollen, gilt als gerechte Alternative zu einer Gesellschaft, in der Herkunft und Stand über den Lebensweg entscheiden. Doch wie meritokratisch sind wir tatsächlich? Bildungsstudien zeichnen ein ernüchterndes Bild. In Deutschland hängt der Schulerfolg stärker vom Elternhaus ab als in vielen anderen Industrieländern. Kinder aus Akademikerfamilien beginnen weitaus häufiger ein Studium als Kinder, deren Eltern keinen Hochschulabschluss haben – selbst bei gleichen Noten. Der Philosoph Michael Sandel geht noch weiter: Selbst eine perfekt funktionierende Meritokratie sei problematisch, weil sie den Erfolgreichen das Gefühl gebe, ihren Status vollständig verdient zu haben, und den weniger Erfolgreichen suggeriere, sie seien an ihrer Lage selbst schuld. Talent, Gesundheit und die Gelegenheit, sich zu entfalten, seien jedoch zu einem erheblichen Teil Glückssache. Eine solche Haltung untergrabe die Solidarität und vergifte das gesellschaftliche Klima.`,

der Stand=сословие
ernüchternd=отрезвляющий
suggerieren=внушать
sich entfalten=развиваться, раскрываться`,

{ t: "Das Erbe der Aufklärung", x: `„Habe Mut, dich deines eigenen Verstandes zu bedienen!“ Mit diesem Satz fasste Immanuel Kant 1784 das Programm der Aufklärung zusammen. Er verstand darunter den Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit, also aus dem Unvermögen, sich ohne die Leitung eines anderen seines Verstandes zu bedienen. Die Aufklärung stellte Autoritäten infrage, die sich bis dahin auf Tradition oder göttliche Ordnung beriefen, und setzte ihnen die Vernunft entgegen. Aus diesem Denken gingen zentrale Errungenschaften der Moderne hervor: die Menschenrechte, die Gewaltenteilung, die Religionsfreiheit, die moderne Wissenschaft. Gleichwohl ist das Erbe nicht unumstritten. Kritiker wie Horkheimer und Adorno argumentierten in ihrer „Dialektik der Aufklärung“, dass die instrumentelle Vernunft, die Natur und Menschen beherrschbar machen wolle, selbst in neue Formen der Herrschaft umschlagen könne. Postkoloniale Denker wiesen zudem darauf hin, dass dieselben Philosophen, die universelle Rechte proklamierten, häufig Kolonialismus und Sklaverei rechtfertigten. Dennoch bleibt die Forderung, Behauptungen kritisch zu prüfen, statt sie blind zu übernehmen, angesichts von Desinformation aktueller denn je.`,
g: `sich bedienen=пользоваться
die Unmündigkeit=несовершеннолетие, незрелость
sich berufen auf=ссылаться на
die Errungenschaft=достижение
umschlagen in=перерастать в`,
q: [["c", "Wie definierte Kant die Aufklärung?", ["als Rückkehr zur Tradition", "als Ausgang aus der selbstverschuldeten Unmündigkeit", "als Herrschaft der Kirche"], 1], ["t", "Die Aufklärung berief sich vor allem auf die göttliche Ordnung.", 0], ["c", "Was kritisierten Horkheimer und Adorno?", ["dass die instrumentelle Vernunft in Herrschaft umschlagen kann", "dass es zu wenig Wissenschaft gab", "dass Kant zu religiös war"], 0], ["t", "Laut Text ist die Forderung nach kritischer Prüfung heute weniger relevant.", 0], ["i", "In welchem Jahr formulierte Kant seinen berühmten Satz?", ["1784"]]] },

{ t: "Wenn Maschinen arbeiten", x: `Die Sorge, Maschinen könnten den Menschen die Arbeit wegnehmen, ist so alt wie die Industrialisierung selbst. Im frühen 19. Jahrhundert zerstörten englische Textilarbeiter, die sogenannten Ludditen, mechanische Webstühle, weil sie um ihre Existenz fürchteten. Rückblickend erwies sich die Angst vor dem Ende der Arbeit als unbegründet: Zwar verschwanden zahlreiche Tätigkeiten, doch es entstanden neue, oft besser bezahlte Berufe. Ob sich diese Geschichte wiederholt, ist allerdings offen. Anders als frühere Technologien betreffen lernfähige Systeme nicht mehr nur körperliche Routinearbeit, sondern zunehmend auch kognitive Tätigkeiten: das Verfassen von Texten, das Auswerten von Verträgen, das Programmieren. Ökonomen sind uneins, wie sich das auf den Arbeitsmarkt auswirken wird. Optimisten erwarten, dass KI vor allem lästige Teilaufgaben übernimmt und Menschen sich auf kreativere und zwischenmenschliche Arbeit konzentrieren können. Pessimisten befürchten, dass die Produktivitätsgewinne vor allem den Kapitaleignern zugutekommen und die Ungleichheit wächst. Unstrittig ist nur, dass sich viele Berufsbilder grundlegend wandeln werden und dass Bildungssysteme darauf vorbereitet sein müssen.`,
g: `der Webstuhl=ткацкий станок
unbegründet=необоснованный
uneins=не согласные между собой
lästig=надоедливый, обременительный
zugutekommen=идти на пользу`,
q: [["c", "Wer waren die Ludditen?", ["englische Textilarbeiter", "deutsche Ingenieure", "französische Bauern"], 0], ["t", "Rückblickend war die Angst vor dem Ende der Arbeit im 19. Jahrhundert begründet.", 0], ["c", "Was unterscheidet lernfähige Systeme von früheren Technologien?", ["Sie betreffen auch kognitive Tätigkeiten.", "Sie sind billiger.", "Sie ersetzen nur körperliche Arbeit."], 0], ["t", "Pessimisten befürchten eine wachsende Ungleichheit.", 1], ["i", "Was müssen laut Text auf den Wandel vorbereitet sein?", ["Bildungssysteme", "die Bildungssysteme"]]] },

{ t: "Vom Wert des Scheiterns", x: `In Silicon Valley gilt ein gescheitertes Start-up beinahe als Auszeichnung: Wer gescheitert ist, hat etwas gewagt und daraus gelernt. In Deutschland hingegen haftet dem Scheitern noch immer ein Makel an. Wer mit einem Unternehmen in die Insolvenz geht, hat es oft schwer, erneut Kapital oder auch nur Vertrauen zu gewinnen. Psychologen sehen in dieser Fehlerkultur ein Problem, das weit über die Wirtschaft hinausreicht. Bereits in der Schule lernen Kinder, dass Fehler mit schlechten Noten bestraft werden, statt sie als notwendigen Teil des Lernprozesses zu begreifen. Die Folge sei eine Haltung, die Risiken scheut und Innovation hemmt. Forschungen zur sogenannten Wachstumsorientierung legen nahe, dass Menschen, die ihre Fähigkeiten als entwickelbar betrachten, Rückschläge besser verkraften und langfristig erfolgreicher sind als jene, die Talent für angeboren halten. Gleichwohl warnen Kritiker vor einer romantischen Verklärung. Scheitern ist nicht per se lehrreich; es kann Existenzen zerstören, Schulden hinterlassen und tiefe Verletzungen verursachen. Entscheidend sei, ob eine Gesellschaft Strukturen bietet, die einen Neuanfang ermöglichen – etwa ein Insolvenzrecht, das Gescheiterten eine zweite Chance gibt.`,

hemmen=тормозить

{ t: "Klimaschutz und Gerechtigkeit", x: `Klimapolitik ist nicht nur eine technische, sondern zutiefst eine soziale Frage. Das zeigt sich sowohl global als auch innerhalb einzelner Länder. Weltweit haben die reichsten zehn Prozent der Menschheit einen weitaus größeren Anteil an den Emissionen als die ärmere Hälfte, während gerade die ärmsten Regionen am stärksten unter Dürren, Überschwemmungen und Ernteausfällen leiden. Länder des globalen Südens fordern daher, dass die Industriestaaten, die historisch den Großteil der Treibhausgase ausgestoßen haben, für Schäden und Anpassungsmaßnahmen aufkommen. Auch national stellt sich die Verteilungsfrage. Ein steigender CO2-Preis verteuert Heizen und Autofahren und belastet Haushalte mit geringem Einkommen relativ stärker, da sie einen größeren Teil ihres Budgets für Energie ausgeben. Ökonomen schlagen deshalb vor, die Einnahmen aus der CO2-Bepreisung in Form eines Klimagelds pro Kopf an die Bevölkerung zurückzuzahlen. Wer wenig verbraucht, würde so unterm Strich sogar profitieren. Ohne einen solchen sozialen Ausgleich, so die Warnung vieler Fachleute, droht Klimapolitik die Akzeptanz zu verlieren, auf die sie dringend angewiesen ist.`,

aufkommen für=оплачивать, нести расходы
die Bepreisung=установление цены
unterm Strich=в итоге
angewiesen sein auf=зависеть от`,

{ t: "Die Übersetzerin", x: `Seit dreißig Jahren übersetzte Hanna Lindqvist Romane aus dem Schwedischen ins Deutsche. Sie kannte die Eigenheiten ihrer Autoren besser als deren Lektoren: die Vorliebe des einen für endlose Nebensätze, die Angewohnheit der anderen, wichtige Dinge in Halbsätzen zu verstecken. Übersetzen, pflegte sie zu sagen, sei kein Austausch von Wörtern, sondern das Verpflanzen einer Stimme in fremde Erde. Im vergangenen Frühjahr erhielt sie einen Anruf ihres Verlags. Man sei sehr zufrieden mit ihrer Arbeit, aber man wolle künftig „effizienter“ arbeiten. Die nächsten Bücher würden maschinell vorübersetzt; sie solle die Texte nur noch nachbearbeiten – zu einem Bruchteil ihres bisherigen Honorars. Hanna sagte zu, weil sie die Miete bezahlen musste. Der erste Text, den sie erhielt, war erstaunlich flüssig. Grammatikalisch fehlerfrei, beinahe elegant. Und doch fehlte etwas, das sie nicht sofort benennen konnte. Erst beim dritten Kapitel verstand sie es: Die Maschine hatte jede Mehrdeutigkeit aufgelöst. Wo der Autor absichtlich offen ließ, ob eine Figur log oder die Wahrheit sagte, hatte das Programm sich entschieden. Hanna saß lange vor dem Bildschirm. Dann begann sie, den Text Satz für Satz neu zu schreiben.`,

verpflanzen=пересаживать

{ t: "Die Sehnsucht nach gestern", x: `Lange galt Nostalgie als Krankheit. Der Begriff wurde 1688 von dem Schweizer Arzt Johannes Hofer geprägt, der damit das quälende Heimweh von Söldnern beschrieb, die fern ihrer Heimat dienten. Man vermutete die Ursache im Gehirn und hielt das Leiden für potenziell tödlich. Heute sehen Psychologen das Phänomen differenzierter. Studien zeigen, dass nostalgische Erinnerungen – meist an Momente mit nahestehenden Menschen oder an bedeutsame Lebensereignisse – das Gefühl sozialer Verbundenheit stärken, Einsamkeit lindern und dem eigenen Leben Sinn und Kontinuität verleihen können. Nostalgie tritt besonders häufig in Phasen des Umbruchs auf: nach einem Umzug, beim Übergang ins Erwachsenenleben oder in gesellschaftlichen Krisen. Sie wirkt dann wie ein emotionaler Anker. Allerdings hat sie auch Schattenseiten. Erinnerungen werden im Rückblick geschönt; Unangenehmes verblasst, Schönes leuchtet heller. Auf gesellschaftlicher Ebene kann eine verklärte Vergangenheit politisch instrumentalisiert werden – etwa in Slogans, die die Rückkehr zu einer angeblich besseren Zeit versprechen, die es so nie gegeben hat. Ob Nostalgie heilt oder lähmt, hängt also davon ab, ob sie den Blick nach vorn ermöglicht oder versperrt.`,

lindern=облегчать
verblassen=блёкнуть
lähmen=парализовать`,

{ t: "Macht Konsum glücklich?", x: `Seit Jahrzehnten untersuchen Ökonomen und Psychologen den Zusammenhang zwischen Wohlstand und Lebenszufriedenheit. Ein viel zitierter Befund ist das sogenannte Easterlin-Paradox: Obwohl das Pro-Kopf-Einkommen in vielen Industrieländern seit den 1950er Jahren stark gestiegen ist, hat die durchschnittliche Zufriedenheit kaum zugenommen. Wie lässt sich das erklären? Ein Faktor ist die hedonistische Anpassung. Menschen gewöhnen sich erstaunlich schnell an Verbesserungen ihres Lebensstandards. Das neue Auto, die größere Wohnung bereiten zunächst Freude, werden aber bald zur Selbstverständlichkeit. Ein zweiter Faktor ist der soziale Vergleich: Für das Wohlbefinden ist oft nicht entscheidend, wie viel man besitzt, sondern wie viel man im Verhältnis zu anderen besitzt. Neuere Studien relativieren das Paradox allerdings. Sie zeigen, dass mehr Einkommen durchaus mit mehr Zufriedenheit einhergeht, der Effekt bei hohen Einkommen jedoch abflacht. Zudem kommt es darauf an, wofür man Geld ausgibt. Erlebnisse wie Reisen oder Konzerte machen nachhaltiger glücklich als materielle Güter, und Ausgaben für andere Menschen steigern das Wohlbefinden stärker als Ausgaben für sich selbst.`,

im Verhältnis zu=по сравнению с

abflachen=ослабевать, выравниваться`,
q: [["c", "Was besagt das Easterlin-Paradox?", ["Mehr Einkommen führt zu viel mehr Zufriedenheit.", "Trotz steigenden Einkommens hat die Zufriedenheit kaum zugenommen.", "Ärmere Länder sind unglücklicher."], 1], ["t", "Menschen gewöhnen sich laut Text nur langsam an einen höheren Lebensstandard.", 0], ["c", "Was macht laut Studien nachhaltiger glücklich?", ["materielle Güter", "Erlebnisse wie Reisen oder Konzerte", "teure Kleidung"], 1], ["t", "Ausgaben für andere steigern das Wohlbefinden stärker als Ausgaben für sich selbst.", 1], ["i", "Wie heißt der Mechanismus, durch den man sich an Verbesserungen gewöhnt? Hedonistische …", ["Anpassung"]]] },

{ t: "Populismus", x: `Kaum ein politischer Begriff wird so inflationär verwendet wie „Populismus“. Oft dient er schlicht als Schimpfwort für politische Gegner. Politikwissenschaftler bemühen sich dagegen um eine präzisere Definition. Nach einem verbreiteten Ansatz zeichnet sich Populismus weniger durch bestimmte Inhalte aus als durch eine Denkfigur: die Gegenüberstellung eines „reinen Volkes“ und einer „korrupten Elite“. Populisten beanspruchen, als Einzige den wahren Willen des Volkes zu vertreten. Daraus folgt ein problematischer Umgang mit Pluralismus: Wer anderer Meinung ist, gehört aus populistischer Sicht nicht zum „eigentlichen“ Volk. Populismus kann sich mit unterschiedlichen Ideologien verbinden – mit nationalistischen ebenso wie mit linken. Die Ursachen für seinen Aufschwung in vielen Demokratien sind umstritten. Diskutiert werden ökonomische Verunsicherung infolge der Globalisierung, kulturelle Gegenreaktionen auf gesellschaftlichen Wandel und ein wachsendes Gefühl, von den etablierten Parteien nicht gehört zu werden. Manche Forscher sehen im Populismus daher auch ein Symptom: Er weise auf reale Repräsentationsdefizite hin, auch wenn seine Antworten die liberale Demokratie gefährden können.`,

das Schimpfwort=ругательство
die Denkfigur=фигура мысли, схема
beanspruchen=претендовать
das Defizit=дефицит, недостаток`,

{ t: "Das Recht auf Vergessenwerden", x: `Das Internet vergisst nicht – so lautete lange eine Binsenweisheit. Ein unbedachter Kommentar, ein peinliches Foto, ein Zeitungsbericht über eine längst beglichene Schuld: Was einmal online steht, kann Jahrzehnte später noch auffindbar sein und Bewerbungen, Beziehungen oder den Ruf beschädigen. 2014 setzte der Europäische Gerichtshof einen Meilenstein. Ein Spanier hatte geklagt, weil eine Suchmaschine bei der Eingabe seines Namens noch immer auf eine Zeitungsanzeige über die Zwangsversteigerung seines Hauses verwies, obwohl die Angelegenheit seit Jahren erledigt war. Das Gericht entschied, dass Betroffene unter bestimmten Umständen verlangen können, dass solche Links aus den Suchergebnissen entfernt werden. Später wurde dieses „Recht auf Vergessenwerden“ in der Datenschutz-Grundverordnung verankert. Kritiker sahen darin eine Gefahr für die Pressefreiheit und das Recht der Öffentlichkeit auf Information. Wer entscheidet, welche Informationen von öffentlichem Interesse sind? Tatsächlich muss in jedem Einzelfall abgewogen werden: Bei Politikern oder Personen des öffentlichen Lebens überwiegt oft das Informationsinteresse, bei Privatpersonen eher der Schutz der Persönlichkeit.`,

{ t: "Der Zeuge", x: `Fünfzehn Jahre lang hatte Konrad Albers geschwiegen. Er war damals Buchhalter bei einer mittelgroßen Baufirma gewesen und hatte bemerkt, dass Rechnungen für Projekte gestellt wurden, die nie existierten. Als er seinen Vorgesetzten darauf ansprach, lächelte dieser nur und sagte, es gebe Dinge, die man besser nicht verstehe. Zwei Wochen später erhielt Albers eine Gehaltserhöhung. Er nahm sie an, und er schwieg. Er redete sich ein, dass er keine Beweise habe, dass niemand ihm glauben würde, dass er an seine Familie denken müsse. Jahre vergingen. Die Firma wurde verkauft, der Vorgesetzte machte Karriere in der Landespolitik. Als Albers in einer Zeitung las, dass genau dieser Mann nun für einen Untersuchungsausschuss zur Korruption im Bauwesen nominiert worden war, legte er die Zeitung beiseite und ging in den Keller. In einem Karton lagen die Kopien, die er damals heimlich angefertigt hatte und die er nie hatte wegwerfen können. Am nächsten Morgen rief er eine Journalistin an. Seine Stimme zitterte, als er sagte: „Ich glaube, ich habe Ihnen etwas zu erzählen.“`,

{ t: "Kulturelle Aneignung", x: `Darf eine weiße Sängerin Dreadlocks tragen? Darf ein Restaurant ohne mexikanische Wurzeln Tacos als „authentisch“ bewerben? Fragen wie diese werden unter dem Schlagwort „kulturelle Aneignung“ verhandelt und lösen regelmäßig erhitzte Debatten aus. Gemeint ist die Übernahme von Elementen einer Kultur durch Angehörige einer anderen, insbesondere wenn eine dominante Gruppe sich bei einer historisch benachteiligten bedient. Kritiker argumentieren, dass dabei kulturelle Symbole aus ihrem Kontext gerissen, kommerzialisiert und ihrer Bedeutung beraubt würden, während die Menschen, die sie hervorgebracht haben, für dieselben Merkmale oft diskriminiert wurden oder werden. Gegner des Konzepts halten dem entgegen, dass Kulturen nie abgeschlossene Einheiten gewesen seien. Austausch, Vermischung und gegenseitige Inspiration seien vielmehr der Motor kultureller Entwicklung – von der Musik über die Küche bis zur Mode. Ein pauschales Verbot führe zu einer Art kultureller Abschottung. Viele Beobachter plädieren für eine differenzierte Betrachtung: Entscheidend seien Respekt, Kenntnis des Ursprungs und die Frage, wer von der Übernahme wirtschaftlich profitiert.`,

berauben=лишать
hervorbringen=создавать, порождать

{ t: "Einsamkeit als Volkskrankheit", x: `Einsamkeit galt lange als privates Problem, über das man nicht spricht. Inzwischen wird sie zunehmend als gesellschaftliche Herausforderung erkannt. Großbritannien ernannte 2018 als erstes Land eine Ministerin für Einsamkeit, und auch in Deutschland gibt es mittlerweile eine nationale Strategie gegen Einsamkeit. Die Forschung unterscheidet dabei zwischen Alleinsein und Einsamkeit. Wer allein lebt, muss nicht einsam sein, und umgekehrt kann man sich inmitten einer Familie oder eines großen Freundeskreises einsam fühlen. Einsamkeit beschreibt die schmerzhafte Diskrepanz zwischen den gewünschten und den tatsächlichen sozialen Beziehungen. Ihre gesundheitlichen Folgen sind erheblich. Chronische Einsamkeit erhöht das Risiko für Herz-Kreislauf-Erkrankungen, Depressionen und Demenz; manche Studien vergleichen ihre Schädlichkeit mit dem Rauchen von 15 Zigaretten am Tag. Entgegen einem verbreiteten Klischee sind keineswegs nur ältere Menschen betroffen. Besonders hohe Werte finden sich auch bei jungen Erwachsenen, etwa in Umbruchsphasen wie dem Studienbeginn. Als Gegenmittel setzen Kommunen auf Begegnungsorte, Nachbarschaftsprojekte und generationenübergreifende Angebote.`,

{ t: "Die Entdeckung der Langsamkeit", x: `Wir leben in einer Kultur der Beschleunigung. Nachrichten erreichen uns in Echtzeit, Lieferdienste versprechen die Zustellung binnen Stunden, und wer auf eine E-Mail nicht sofort antwortet, gilt schnell als unzuverlässig. Der Soziologe Hartmut Rosa hat dieses Phänomen eingehend untersucht. Er unterscheidet drei Dimensionen: die technische Beschleunigung, die Beschleunigung des sozialen Wandels und die Beschleunigung des Lebenstempos. Paradox sei, dass uns technische Neuerungen eigentlich Zeit sparen sollten, wir aber dennoch das Gefühl haben, immer weniger davon zu besitzen. Der Grund: Wir nutzen die gewonnene Zeit, um noch mehr zu erledigen. Als Gegenentwurf haben sich in den vergangenen Jahrzehnten verschiedene Bewegungen formiert, von Slow Food über Slow Travel bis zu „Cittaslow“, einem Netzwerk von Kleinstädten, die bewusst auf Lebensqualität statt auf Wachstum setzen. Rosa selbst hält bloße Entschleunigung jedoch für keine ausreichende Antwort. Langsamkeit sei kein Wert an sich; ein langsamer Stau mache niemanden glücklich. Worauf es ankomme, sei „Resonanz“: eine lebendige, antwortende Beziehung zur Welt, zu anderen Menschen und zu den Dingen, die wir tun.`,

binnen=в течение
eingehend=подробно
der Gegenentwurf=альтернативная модель

};

    'pünktlich=пунктуально, вовремя': 'adv', 'gemeinsam=общий, вместе': 'adj', 'schuld=виноватый': 'adj',
    'während=во время, в то время как': 'conj', 'um … zu=чтобы (с инфинитивом)': 'conj'
  };
  // существительные, которые бывают только во множественном числе
  const PL_ONLY = set('Eltern Leute Geschwister Handschuhe Nudeln Kosten Schulden Zinsen Ausgaben Einnahmen Daten Medien Nachrichten Ferien Unterlagen Möbel Nebenkosten Kenntnisse Rahmenbedingungen USA Abgase Brennstoffe Menschenrechte Arbeitsbedingungen Abwehrkräfte Studiengebühren Kopfschmerzen Schmerzen Netzwerke');

  const verbLike = w => VERB.has(w) || (/^[a-zäöüß]+$/.test(w) && /(en|ern|eln)$/.test(w) && !NOT_VERB.has(w) && !ADV.has(w));

  window.classifyWord = function (de, ru, art, base, sectionDefault) {
    const key = de + '=' + ru;
    if (EXACT[key]) return EXACT[key];
    if (art) {
      if (ORD.has(base)) return 'num';
      return 'noun';
    }
    if (sectionDefault === 'phrase' && de.includes(' ')) return 'phrase';

    if (sectionDefault) return sectionDefault;
    if (verbLike(w)) return 'verb';
    return 'adj';
  };
